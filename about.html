<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearLog — About</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2A93B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
window.CURRENT_PAGE = "about";

function aboutPageHTML(){
  const aiParas = t("about.aiBody").map(p => `<p style="font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0 0 14px;">${p}</p>`).join("");
  const dataParas = t("about.dataBody").map(p => `<p style="font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0 0 14px;">${p}</p>`).join("");

  const entries = t("changelog");
  const entriesHTML = entries.map(v => `
    <div style="margin-bottom:20px;">
      <div style="font-family:var(--font-display); font-weight:600; color:var(--amber); font-size:13px; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;">v${v.version}</div>
      <ul style="margin:0; padding-left:18px; color:var(--text-dim); font-size:13.5px; line-height:1.6;">${v.items.map(i => `<li style="margin-bottom:4px;">${i}</li>`).join("")}</ul>
    </div>
  `).join("");

  return `
    <section class="card">
      <h2>${t("about.aiTitle")}</h2>
      ${aiParas}
    </section>

    <section class="card">
      <h2>${t("about.dataTitle")}</h2>
      ${dataParas}
    </section>

    <section class="card">
      <h2>${t("about.changelogTitle")}</h2>
      ${entriesHTML}
    </section>
  `;
}

function render(){
  try{
    document.documentElement.lang = state.language;
    let html = headerHTML() + navHTML();
    html += aboutPageHTML();
    html += footerHTML() + changelogModalHTML() + confirmModalHTML() + toastHTML();
    appEl.innerHTML = html;
  }catch(err){
    console.error("GearLog render error:", err);
    appEl.innerHTML = `
      <div style="padding:60px 20px; text-align:center; font-family:sans-serif; color:#EDEAE3;">
        <p style="color:#D4574B; font-size:15px;">Something went wrong displaying GearLog.</p>
        <p style="color:#9096A0; font-size:13px; max-width:420px; margin:8px auto 20px;">This is usually caused by leftover data from an older version. Clearing saved data will fix it — export a backup first if you can.</p>
        <button type="button" onclick="localStorage.removeItem('gearlog_state_v2'); localStorage.removeItem('gearlog_state_v1'); location.reload();" style="padding:12px 20px; background:#D4574B; color:#2A0C09; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Clear saved data & reload</button>
      </div>
    `;
  }
}

appEl.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("modal-overlay")){
    const overlayAction = e.target.getAttribute("data-dismiss-action");
    if(overlayAction === "dismiss-changelog"){
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
    }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");

  switch(action){
    case "dismiss-changelog":
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
      break;

    case "toggle-language":
      state.language = state.language === "en" ? "fr" : "en";
      saveState(); render();
      break;
  }
});

render();
</script>
</body>
</html>
