<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearLog — Account</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2A93B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
window.CURRENT_PAGE = "account";

let acctUi = { invitesBusy: null, invitesError: null, loginError: null, signupError: null, signupSentTo: null, nameMsg: null, emailMsg: null, passwordMsg: null, busy: false, busyAction: null, loginEmail: "", signupEmail: "", showForgotPassword: false, resetLinkSentTo: null, forgotError: null };

function fieldVal(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function attrEsc(v){
  return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Only the button that was actually pressed switches to "Working…"; the rest just stay disabled.
function btnLabel(action, normal){
  return (acctUi.busy && acctUi.busyAction === action) ? t("account.workingBtn") : normal;
}

function accountPageHTML(){
  if(!authReady){
    return `<section class="card"><p class="card-sub">Loading…</p></section>`;
  }

  if(!currentUser){
    const signupNotice = (acctUi.signupSentTo && !acctUi.showForgotPassword && !acctUi.resetLinkSentTo)
      ? `<div class="preview-banner"><b>${t("account.checkEmailTitle")}</b><br>${t("account.checkEmailBody")(acctUi.signupSentTo)}</div>`
      : "";

    let loginCardBody;
    if(acctUi.resetLinkSentTo){
      loginCardBody = `
        <div class="preview-banner"><b>${t("account.resetLinkSentTitle")}</b><br>${t("account.resetLinkSentBody")(acctUi.resetLinkSentTo)}</div>
        <div class="actions-row" style="margin-top:16px;">
          <button class="btn secondary" type="button" data-action="show-login">${t("account.backToLoginBtn")}</button>
        </div>
      `;
    } else if(acctUi.showForgotPassword){
      loginCardBody = `
        <h2>${t("account.resetPasswordTitle")}</h2>
        <p class="card-sub">${t("account.resetPasswordIntro")}</p>
        ${acctUi.forgotError ? `<p style="color:var(--red-text,#D4574B); font-size:12.5px; margin:-4px 0 10px;">${acctUi.forgotError}</p>` : ""}
        <form id="forgot-form" data-submit="do-forgot-password" autocomplete="on">
          <label class="field">${t("account.fields.email")}
            <input type="email" id="forgot-email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <div class="actions-row" style="margin-top:16px;">
            <button class="btn secondary" type="button" data-action="show-login" ${acctUi.busy ? "disabled" : ""}>${t("account.backToLoginBtn")}</button>
            <button class="btn c-blue" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-forgot-password", t("account.sendResetLinkBtn"))}</button>
          </div>
        </form>
      `;
    } else {
      loginCardBody = `
        <h2>${t("account.loginTitle")}</h2>
        ${acctUi.loginError ? `<p style="color:var(--red-text,#D4574B); font-size:12.5px; margin:-4px 0 10px;">${acctUi.loginError}</p>` : ""}
        <form id="login-form" data-submit="do-login" autocomplete="on">
          <div style="display:flex; flex-direction:column; gap:12px;">
            <label class="field">${t("account.fields.email")}
              <input type="email" id="login-email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" value="${attrEsc(acctUi.loginEmail)}" ${acctUi.busy ? "disabled" : ""}>
            </label>
            <label class="field">${t("account.fields.password")}
              <input type="password" id="login-password" name="password" autocomplete="current-password" ${acctUi.busy ? "disabled" : ""}>
            </label>
          </div>
          <div class="actions-row" style="margin-top:12px; justify-content:flex-end;">
            <button class="btn-link" type="button" data-action="show-forgot-password" ${acctUi.busy ? "disabled" : ""}>${t("account.forgotPasswordLink")}</button>
          </div>
          <div class="actions-row" style="margin-top:12px;">
            <button class="btn c-blue" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-login", t("account.loginBtn"))}</button>
          </div>
        </form>
      `;
    }

    return `
      <div class="warn-banner"><b>⚠</b> ${t("account.notLoggedInWarning")}</div>
      ${signupNotice}

      <div class="account-forms">
        <section class="card">
          ${loginCardBody}
        </section>

        <section class="card">
          <h2>${t("account.signupTitle")}</h2>
          ${acctUi.signupError ? `<p style="color:var(--red-text,#D4574B); font-size:12.5px; margin:-4px 0 10px;">${acctUi.signupError}</p>` : ""}
          <form id="signup-form" data-submit="do-signup" autocomplete="on">
            <div style="display:flex; flex-direction:column; gap:12px;">
              <label class="field">${t("account.fields.email")}
                <input type="email" id="signup-email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" value="${attrEsc(acctUi.signupEmail)}" ${acctUi.busy ? "disabled" : ""}>
              </label>
              <label class="field">${t("account.fields.password")}
                <input type="password" id="signup-password" name="new-password" autocomplete="new-password" ${acctUi.busy ? "disabled" : ""}>
              </label>
              <label class="field">${t("account.fields.confirmPassword")}
                <input type="password" id="signup-confirm" name="confirm-new-password" autocomplete="new-password" ${acctUi.busy ? "disabled" : ""}>
              </label>
            </div>
            <div class="actions-row" style="margin-top:16px;">
              <button class="btn c-green" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-signup", t("account.signupBtn"))}</button>
            </div>
          </form>
        </section>
      </div>
    `;
  }

  // Logged in — clear any leftover state from the logged-out view (e.g. "check your
  // email" from signup) so it can't resurface later after a subsequent log out.
  if(acctUi.signupSentTo || acctUi.loginError || acctUi.signupError){
    acctUi.signupSentTo = null;
    acctUi.loginError = null;
    acctUi.signupError = null;
  }
  const displayName = currentProfile && currentProfile.username ? currentProfile.username : "";
  return `
    <section class="card">
      <h2>${t("account.settingsTitle")}</h2>
      <p class="card-sub">${t("account.currentEmailLabel")} ${currentUser.email}</p>

      <div style="margin-top:18px;">
        <p style="font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--amber); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">${t("account.changeNameTitle")}</p>
        ${acctUi.nameMsg ? `<p style="font-size:12.5px; color:var(--text-dim); margin:-4px 0 10px;">${acctUi.nameMsg}</p>` : ""}
        <form data-submit="do-update-name" autocomplete="on">
          <label class="field">${t("account.fields.name")}
            <input type="text" id="name-input" name="name" autocomplete="name" value="${attrEsc(displayName)}" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <div class="actions-row" style="margin-top:12px;">
            <button class="btn secondary" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-update-name", t("account.saveBtn"))}</button>
          </div>
        </form>
      </div>

      <div style="margin-top:24px;">
        <p style="font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--amber); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">${t("account.changeEmailTitle")}</p>
        ${acctUi.emailMsg ? `<p style="font-size:12.5px; color:var(--text-dim); margin:-4px 0 10px;">${acctUi.emailMsg}</p>` : ""}
        <form data-submit="do-update-email" autocomplete="off">
          <label class="field">${t("account.fields.email")}
            <input type="email" id="email-input" name="new-email" autocomplete="off" inputmode="email" autocapitalize="none" placeholder="${attrEsc(currentUser.email)}" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <div class="actions-row" style="margin-top:12px;">
            <button class="btn secondary" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-update-email", t("account.saveBtn"))}</button>
          </div>
        </form>
      </div>

      <div style="margin-top:24px;">
        <p style="font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--amber); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">${t("account.changePasswordTitle")}</p>
        ${acctUi.passwordMsg ? `<p style="font-size:12.5px; color:var(--text-dim); margin:-4px 0 10px;">${acctUi.passwordMsg}</p>` : ""}
        <form data-submit="do-update-password" autocomplete="on">
          <input type="email" name="username" autocomplete="username" value="${attrEsc(currentUser.email)}" readonly tabindex="-1" aria-hidden="true" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
          <label class="field" style="margin-bottom:12px;">${t("account.fields.currentPassword")}
            <input type="password" id="current-password-input" name="current-password" autocomplete="current-password" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <label class="field" style="margin-bottom:12px;">${t("account.fields.password")}
            <input type="password" id="new-password-input" name="new-password" autocomplete="new-password" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <label class="field">${t("account.fields.confirmPassword")}
            <input type="password" id="new-password-confirm" name="confirm-new-password" autocomplete="new-password" ${acctUi.busy ? "disabled" : ""}>
          </label>
          <div class="actions-row" style="margin-top:12px;">
            <button class="btn secondary" type="submit" ${acctUi.busy ? "disabled" : ""}>${btnLabel("do-update-password", t("account.saveBtn"))}</button>
          </div>
        </form>
      </div>

      <div class="actions-row" style="margin-top:28px; border-top:1px solid var(--hairline); padding-top:18px;">
        <button class="btn secondary c-red" type="button" data-action="do-logout" ${acctUi.busy ? "disabled" : ""}>${t("account.logoutBtn")}</button>
      </div>
    </section>
    ${invitationsCardHTML()}
  `;
}

function invitationsCardHTML(){
  if(!currentUser) return "";
  if(!pendingInvitationsLoaded && !acctUi.invitesLoading && !acctUi.invitesError){
    acctUi.invitesLoading = true;
    loadMyInvitations().then(r => {
      acctUi.invitesLoading = false;
      if(r.error) acctUi.invitesError = sharingErrorMessage(r.error);
      render();
    });
  }
  const esc = (x) => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const list = pendingInvitations.map(i => {
    const who = esc(i.inviter_username || i.inviter_email || "");
    const label = esc(i.vehicle_label || "");
    const busy = acctUi.invitesBusy === i.id;
    return `
      <div class="share-member-row">
        <div>
          <div class="share-member-name">${esc(i.vehicle_name || label || "—")}</div>
          <div class="share-member-sub">${label && i.vehicle_name ? label + " · " : ""}${t("sharing.account.from")(who)}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn c-green" type="button" data-action="accept-invite" data-key="${i.id}" ${acctUi.invitesBusy ? "disabled" : ""}>${busy ? t("sharing.working") : t("sharing.account.accept")}</button>
          <button class="btn secondary" type="button" data-action="decline-invite" data-key="${i.id}" ${acctUi.invitesBusy ? "disabled" : ""}>${t("sharing.account.decline")}</button>
        </div>
      </div>`;
  }).join("");
  return `
    <section class="card" id="service-invitations-card">
      <h2>${t("sharing.account.title")}</h2>
      <p class="card-sub">${t("sharing.account.intro")}</p>
      ${acctUi.invitesError ? `<p class="share-error">${esc(acctUi.invitesError)}</p>` : ""}
      ${!pendingInvitationsLoaded && !acctUi.invitesError ? `<p class="card-sub">${t("sharing.loadingMembers")}</p>` : (list || `<p class="card-sub">${t("sharing.account.none")}</p>`)}
    </section>
  `;
}

function render(){
  try{
    document.documentElement.lang = state.language;
    document.body.classList.toggle("qc-theme", state.language === "qc");
    let html = headerHTML() + navHTML();
    html += accountPageHTML();
    html += footerHTML() + changelogModalHTML() + confirmModalHTML() + toastHTML() + tourOverlayHTML();
    appEl.innerHTML = html;
    setTimeout(applyTourHighlight, 30);
  }catch(err){
    console.error("GearLog render error:", err);
    appEl.innerHTML = `
      <div style="padding:60px 20px; text-align:center; font-family:sans-serif; color:#EDEAE3;">
        <p style="color:#D4574B; font-size:15px;">Something went wrong displaying GearLog.</p>
        <p style="color:#9096A0; font-size:13px; max-width:420px; margin:8px auto 20px;">This is usually caused by leftover data from an older version. Clearing saved data will fix it — export a backup first if you can.</p>
        <button type="button" onclick="localStorage.removeItem('gearlog_state_v2'); localStorage.removeItem('gearlog_state_v1'); location.reload();" style="padding:12px 20px; background:#D4574B; color:#2A0C09; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Clear saved data & reload</button>
      </div>
    `;
  }
}

appEl.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("modal-overlay")){
    const overlayAction = e.target.getAttribute("data-dismiss-action");
    if(overlayAction === "dismiss-changelog"){
      state.lastSeenChangelogVersion = getLatestChangelogVersion();
      saveState(); render();
    }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  handleAction(el.getAttribute("data-action"), el);
});

// Real <form>s let password managers tell the login, sign-up and change-password fields apart,
// and make Enter submit. We handle the submit ourselves (no page navigation).
appEl.addEventListener("submit", (e) => {
  const form = e.target.closest && e.target.closest("form[data-submit]");
  if(!form) return;
  e.preventDefault();
  if(acctUi.busy) return;
  handleAction(form.getAttribute("data-submit"), form);
});

function handleAction(action, el){
  switch(action){
    case "logo-click":
      window.location.href = "index.html";
      break;

    case "tour-next":
      tourNext();
      break;

    case "tour-back":
      tourBack();
      break;

    case "tour-skip":
      tourSkip();
      break;

    case "tour-toggle-minimize":
      tourToggleMinimize();
      break;

    case "dismiss-changelog":
      state.lastSeenChangelogVersion = getLatestChangelogVersion();
      saveState(); render();
      break;

    case "toggle-language":
      state.language = state.language === "en" ? "fr" : "en";
      saveState(); render();
      break;

    case "show-forgot-password":
      acctUi.showForgotPassword = true;
      acctUi.forgotError = null;
      acctUi.signupSentTo = null;
      render();
      break;

    case "show-login":
      acctUi.showForgotPassword = false;
      acctUi.resetLinkSentTo = null;
      acctUi.forgotError = null;
      render();
      break;

    case "do-forgot-password": {
      const email = fieldVal("forgot-email");
      if(!email){ acctUi.forgotError = t("account.fillAllFields"); render(); break; }
      acctUi.busy = true; acctUi.busyAction = "do-forgot-password"; acctUi.forgotError = null; render();
      authRequestPasswordReset(email).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.forgotError = error.message || String(error); render(); return; }
        acctUi.showForgotPassword = false;
        acctUi.resetLinkSentTo = email;
        render();
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.forgotError = (err && err.message) || String(err); render();
      });
      break;
    }

    case "do-login": {
      const email = fieldVal("login-email");
      const password = fieldVal("login-password");
      acctUi.loginEmail = email;
      if(!email || !password){ acctUi.loginError = t("account.fillAllFields"); render(); break; }
      acctUi.busy = true; acctUi.busyAction = "do-login"; acctUi.loginError = null; render();
      authLogIn(email, password).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.loginError = error.message || String(error); render(); return; }
        // onAuthStateChange picks up the new session and re-renders once data is synced.
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.loginError = (err && err.message) || String(err); render();
      });
      break;
    }

    case "do-signup": {
      const email = fieldVal("signup-email");
      const password = fieldVal("signup-password");
      const confirm = fieldVal("signup-confirm");
      acctUi.signupEmail = email;
      if(!email || !password || !confirm){ acctUi.signupError = t("account.fillAllFields"); render(); break; }
      if(password !== confirm){ acctUi.signupError = t("account.passwordMismatch"); render(); break; }
      acctUi.busy = true; acctUi.busyAction = "do-signup"; acctUi.signupError = null; render();
      authSignUp(email, password).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.signupError = error.message || String(error); render(); return; }
        acctUi.signupSentTo = email;
        render();
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.signupError = (err && err.message) || String(err); render();
      });
      break;
    }

    case "do-logout":
      authLogOut().then(() => {
        acctUi = { loginError: null, signupError: null, signupSentTo: null, nameMsg: null, emailMsg: null, passwordMsg: null, busy: false, busyAction: null, loginEmail: "", signupEmail: "", showForgotPassword: false, resetLinkSentTo: null, forgotError: null };
        showToast(t("account.loggedOutToast"));
      });
      break;

    case "do-update-name": {
      const name = fieldVal("name-input");
      acctUi.busy = true; acctUi.busyAction = "do-update-name"; render();
      authUpdateName(name || null).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.nameMsg = error.message || String(error); render(); return; }
        acctUi.nameMsg = null;
        render();
        showToast(t("account.nameSavedToast"));
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.nameMsg = (err && err.message) || String(err); render();
      });
      break;
    }

    case "do-update-email": {
      const email = fieldVal("email-input");
      if(!email){ acctUi.emailMsg = t("account.fillAllFields"); render(); break; }
      acctUi.busy = true; acctUi.busyAction = "do-update-email"; render();
      authUpdateEmail(email).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.emailMsg = error.message || String(error); render(); return; }
        acctUi.emailMsg = t("account.emailChangeSentToast");
        render();
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.emailMsg = (err && err.message) || String(err); render();
      });
      break;
    }

    case "accept-invite": {
      const id = el.getAttribute("data-key");
      acctUi.invitesBusy = id; acctUi.invitesError = null; render();
      acceptInvitationNow(id).then(r => {
        acctUi.invitesBusy = null;
        if(r.error){ acctUi.invitesError = sharingErrorMessage(r.error); render(); return; }
        render();
        showToast(t("sharing.account.acceptedToast")(r.name));
      });
      break;
    }

    case "decline-invite": {
      const id = el.getAttribute("data-key");
      acctUi.invitesBusy = id; acctUi.invitesError = null; render();
      declineInvitationNow(id).then(r => {
        acctUi.invitesBusy = null;
        if(r.error){ acctUi.invitesError = sharingErrorMessage(r.error); render(); return; }
        render();
        showToast(t("sharing.account.declinedToast"));
      });
      break;
    }

    case "do-update-password": {
      const current = fieldVal("current-password-input");
      const next = fieldVal("new-password-input");
      const confirm = fieldVal("new-password-confirm");
      if(!current || !next || !confirm){ acctUi.passwordMsg = t("account.fillAllFields"); render(); break; }
      if(next !== confirm){ acctUi.passwordMsg = t("account.passwordMismatch"); render(); break; }
      acctUi.busy = true; acctUi.busyAction = "do-update-password"; render();
      authUpdatePassword(current, next).then(({ error }) => {
        acctUi.busy = false; acctUi.busyAction = null;
        if(error){ acctUi.passwordMsg = error.message || String(error); render(); return; }
        acctUi.passwordMsg = null;
        render();
        showToast(t("account.passwordChangedToast"));
      }).catch((err) => {
        acctUi.busy = false; acctUi.busyAction = null; acctUi.passwordMsg = (err && err.message) || String(err); render();
      });
      break;
    }
  }
}

render();
</script>
</body>
</html>
