<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearLog — Reset Password</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2A93B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
window.CURRENT_PAGE = "account";

let resetUi = { error: null, busy: false, success: false };

function fieldVal(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function resetPasswordPageHTML(){
  if(!authReady){
    return `<section class="card"><p class="card-sub">Loading…</p></section>`;
  }

  if(resetUi.success){
    return `
      <section class="card" style="text-align:center; padding:40px 24px;">
        <div style="font-size:40px; margin-bottom:12px;">✅</div>
        <h2 style="margin-bottom:10px;">${t("account.passwordSetSuccessTitle")}</h2>
        <p class="card-sub" style="max-width:360px; margin:0 auto 22px;">${t("account.passwordSetSuccessBody")}</p>
        <a class="btn c-blue" href="account.html" style="display:inline-block; text-decoration:none;">${t("account.goToAccountBtn")}</a>
      </section>
    `;
  }

  if(!isPasswordRecovery){
    return `
      <section class="card" style="text-align:center; padding:40px 24px;">
        <p class="card-sub" style="max-width:360px; margin:0 auto;">${t("account.invalidResetLink")}</p>
        <div class="actions-row" style="justify-content:center; margin-top:18px;">
          <a class="btn secondary" href="account.html" style="display:inline-block; text-decoration:none;">${t("account.goToAccountBtn")}</a>
        </div>
      </section>
    `;
  }

  return `
    <section class="card">
      <h2>${t("account.setNewPasswordTitle")}</h2>
      <p class="card-sub">${t("account.setNewPasswordIntro")}</p>
      ${resetUi.error ? `<p style="color:var(--red-text,#D4574B); font-size:12.5px; margin:-4px 0 10px;">${resetUi.error}</p>` : ""}
      <div style="display:flex; flex-direction:column; gap:12px;">
        <label class="field">${t("account.fields.password")}
          <input type="password" id="new-password-input" ${resetUi.busy ? "disabled" : ""}>
        </label>
        <label class="field">${t("account.fields.confirmPassword")}
          <input type="password" id="new-password-confirm" ${resetUi.busy ? "disabled" : ""}>
        </label>
      </div>
      <div class="actions-row" style="margin-top:16px;">
        <button class="btn c-blue" type="button" data-action="do-set-new-password" ${resetUi.busy ? "disabled" : ""}>${resetUi.busy ? t("account.workingBtn") : t("account.setPasswordBtn")}</button>
      </div>
    </section>
  `;
}

function render(){
  try{
    document.documentElement.lang = state.language;
    let html = headerHTML() + navHTML();
    html += resetPasswordPageHTML();
    html += footerHTML() + changelogModalHTML() + confirmModalHTML() + toastHTML();
    appEl.innerHTML = html;
  }catch(err){
    console.error("GearLog render error:", err);
    appEl.innerHTML = `
      <div style="padding:60px 20px; text-align:center; font-family:sans-serif; color:#EDEAE3;">
        <p style="color:#D4574B; font-size:15px;">Something went wrong displaying GearLog.</p>
        <p style="color:#9096A0; font-size:13px; max-width:420px; margin:8px auto 20px;">This is usually caused by leftover data from an older version. Clearing saved data will fix it — export a backup first if you can.</p>
        <button type="button" onclick="localStorage.removeItem('gearlog_state_v2'); localStorage.removeItem('gearlog_state_v1'); location.reload();" style="padding:12px 20px; background:#D4574B; color:#2A0C09; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Clear saved data & reload</button>
      </div>
    `;
  }
}

appEl.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("modal-overlay")){
    const overlayAction = e.target.getAttribute("data-dismiss-action");
    if(overlayAction === "dismiss-changelog"){
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
    }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");

  switch(action){
    case "dismiss-changelog":
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
      break;

    case "toggle-language":
      state.language = state.language === "en" ? "fr" : "en";
      saveState(); render();
      break;

    case "do-set-new-password": {
      const next = fieldVal("new-password-input");
      const confirm = fieldVal("new-password-confirm");
      if(!next || !confirm){ resetUi.error = t("account.fillAllFields"); render(); break; }
      if(next !== confirm){ resetUi.error = t("account.passwordMismatch"); render(); break; }
      resetUi.busy = true; resetUi.error = null; render();
      authSetNewPassword(next).then(({ error }) => {
        resetUi.busy = false;
        if(error){ resetUi.error = error.message || String(error); render(); return; }
        resetUi.success = true;
        render();
      });
      break;
    }
  }
});

render();
</script>
</body>
</html>
