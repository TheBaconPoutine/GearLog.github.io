      <p class="card-sub">Many of these are the actual OEM suppliers behind the badge — same parts, without the dealership markup.</p>

      <details class="sub"><summary><span class="summary-txt">Brakes</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Advics</div></div><p class="note">Toyota brake parts (OEM supplier)</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Akebono</div></div><p class="note">Top brand for Japanese and other brand brake pads</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">EBC</div></div><p class="note">High-performance brakes</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Hawk</div></div><p class="note">High-performance brakes</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Brembo</div></div><p class="note">European brakes</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Wilwood</div></div><p class="note">American brakes</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">PowerStop</div></div><p class="note">High-performance brakes</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Zimmermann</div></div><p class="note">Euro brake parts</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Raybestos</div></div><p class="note">Long-time brake parts supplier</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Centric</div></div><p class="note">Long-time brake parts supplier</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Suspension</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Sankei555</div></div><p class="note">Japanese suspension parts</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Bilstein</div></div><p class="note">German suspension, common on Japanese models too</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">KYB</div></div><p class="note">Japanese suspension</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">MOOG</div></div><p class="note">Domestic car suspensions</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Delphi</div></div><p class="note">Aftermarket suspension</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Mevotech</div></div><p class="note">TTX line only</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Electrical &amp; Thermal</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Denso</div></div><p class="note">Toyota electrical &amp; thermal parts (OEM supplier)</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">NGK &amp; NTK</div></div><p class="note">Honda &amp; other Japanese electrical parts</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Bosch</div></div><p class="note">European electrical parts</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Engine Internals &amp; Filtration</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Aisin</div></div><p class="note">Toyota mechanical engine parts — water pumps, timing components (OEM supplier)</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Mahle</div></div><p class="note">Engine internals &amp; oil filters</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Melling</div></div><p class="note">Engine internals</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Wix</div></div><p class="note">Oil filters</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Drivetrain</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Exedy / LuK</div></div><p class="note">Clutches &amp; flywheels</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Bearings</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Timken</div></div><p class="note">Gold standard bearings</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Koyo</div></div><p class="note">Toyota bearings</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">NSK &amp; NTN</div></div><p class="note">Honda bearings</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Schaeffler</div></div><p class="note">Euro bearings</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">National</div></div><p class="note">Timken's budget line</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">General / Manufacturer-Specific</span></summary><div class="sub-body">
        <div class="item sec-parts"><div class="item-top"><div class="item-name">ACDelco</div></div><p class="note">GM parts supplier</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Motorcraft</div></div><p class="note">Ford parts supplier</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Mopar</div></div><p class="note">Dodge parts supplier</p></div>
        <div class="item sec-parts"><div class="item-top"><div class="item-name">Gates</div></div><p class="note">Leading supplier for belts, pulleys &amp; tensioners</p></div>
      </div></details>
      </div>
    </details>

    <details class="res-section sec-oil">
      <summary><h2>Motor Oil &amp; Transmission Fluid</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub">Trusted lubricant brands, grouped by what they're actually known for.</p>

      <details class="sub" open><summary><span class="summary-txt">Daily Driver / OEM-Approved</span></summary><div class="sub-body">
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Mobil 1</div></div><p class="note">Widely available full synthetic with broad dexos/OEM approvals — the safe daily-driver default</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Pennzoil</div></div><p class="note">PurePlus gas-to-liquid base oil; strong deposit and cleaning performance</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Valvoline</div></div><p class="note">Broad range from conventional to full synthetic; heavy presence at quick-lube chains</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Castrol</div></div><p class="note">EDGE line with Fluid Titanium tech; deep OEM and motorsport partnerships (BMW, Ford)</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Extended-Drain / Severe-Duty</span></summary><div class="sub-body">
        <div class="item sec-oil"><div class="item-top"><div class="item-name">AMSOIL</div></div><p class="note">First API-certified synthetic motor oil (1972); built around extended drain intervals, diesel &amp; severe-duty use</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Liqui Moly</div></div><p class="note">German engineering with a huge additive/oil catalog; strong following in European &amp; JDM tuning circles</p></div>
      </div></details>

      <details class="sub"><summary><span class="summary-txt">Performance / Racing Synthetic</span></summary><div class="sub-body">
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Motul</div></div><p class="note">French motorsport heritage (Le Mans, MotoGP); ester-based technology; popular in JDM &amp; sportbike scenes</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Royal Purple</div></div><p class="note">Proprietary Synerlec additive technology, marketed on friction reduction and performance gains</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Redline</div></div><p class="note">Ester-based full synthetic, premium price — the go-to for track/drag racing and manual gearbox oil</p></div>
      </div></details>
      </div>
    </details>

    <details class="res-section sec-rust">
      <summary><h2>Undercoating &amp; Rustproofing</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub">Oil/wax-based rustproofing vs. rubberized undercoating vs. doing nothing, plus recommended products and local shops.</p>

      <div class="callout">
        <b>Oil-based beats rubberized, with one exception.</b> Lanolin/oil-based coatings (Fluid Film, Woolwax, Surface Shield) stay soft and creep into seams, welds, and cavities rather than forming a hard shell — and because they never fully harden, a scratch or scrape mostly self-heals as the coating flows back over the exposed spot. Rubberized undercoating does the opposite over time: as the vehicle flexes through its life, the rigid coating cracks and chips, and once that happens it traps moisture and road salt directly against the metal — often accelerating rust in exactly the spots it was meant to protect. The one real exception is a rubberized coating applied brand new, before the vehicle has seen meaningful mileage or road salt; in that narrow window it hasn't had a chance to crack yet and can still do its job. The tradeoff with oil-based products is upkeep — since they stay soft, they also wear away and need reapplication roughly once a year.
      </div>
      <div class="callout callout-b">
        <b>Vs. doing nothing:</b> any of these products is meaningfully better than bare metal exposed to Canadian winters, and the main value is preventing rust from starting in the first place. Once rust has already taken hold under trapped moisture, no undercoating fixes that on its own — the rust needs to be treated or removed first.
      </div>

      <details class="sub" open>
        <summary><span class="summary-txt">Recommended Products</span></summary>
        <div class="sub-body">
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.fluid-film.com/" target="_blank" rel="noopener">Fluid Film</a></div></div><p class="note">The original and most widely available lanolin-based rustproofing oil — thin enough to creep deep into seams and cavities, with a long track record in marine and aviation corrosion prevention. Has a distinct lanolin smell that fades after a few days.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.woolwax.com/" target="_blank" rel="noopener">Woolwax</a></div></div><p class="note">Also lanolin-based, but noticeably thicker than Fluid Film — resists wash-off better on high-exposure areas like rocker panels and wheel wells, with less odour. A lower-viscosity (LV) version exists for creeping into tight seams.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://blasterproducts.com/product/surface-shield/" target="_blank" rel="noopener">Surface Shield (B'laster)</a></div></div><p class="note">A newer lanolin-based entry, positioned as comparable to Fluid Film and Woolwax, marketed for up to 2 years of protection. Widely available at hardware stores, making it an easy pick for a DIY driveway job.</p></div>
          <div class="callout callout-c" style="margin-top:16px;">Project Farm has put rust-preventative fluids through comparative testing (multiple products applied side-by-side, tracked over a winter season) — worth watching before picking a product. See the Other Resources section above for their channel.</div>
        </div>
      </details>

      <details class="sub">
        <summary><span class="summary-txt">Local Shops</span></summary>
        <div class="sub-body">
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.rustproofingottawa.com/" target="_blank" rel="noopener">Oil Shield Rust Proofing Ottawa</a></div></div><p class="note">Budget-friendly option for oil-based rustproofing.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.fullmoonautoworks.ca/" target="_blank" rel="noopener">Full Moon Autoworks</a></div></div><p class="note">Uses Fluid Film for their rustproofing service.</p></div>
        </div>
      </details>
      </div>
    </details>

    <footer class="foot">GearLog Resources — compiled Aug 19, 2026</footer>
  `;
}

function resourcesContentFR(){
  return `
    <p style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim2); margin:0 0 20px;"><b style="color:var(--text);">Dernière mise à jour :</b> 19 août 2026</p>

    <details class="res-section sec-tires" id="res-tires">
      <summary><h2>Pneus</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub">Sources de données, classements de marques par catégorie et choix milieu de gamme fiables.</p>

      <details class="acc">
        <summary><span class="summary-txt">Données et avis sur les pneus</span><span class="count-tag">4 sources principales + liste</span></summary>
        <div class="acc-body">
          <div class="res-item sec-tires"><a href="https://www.tyrereviews.com/" target="_blank" rel="noopener">Tyre Reviews</a><p>Excellente base de données sur les pneus, avec de nombreuses ressources : essais documentés, fiches techniques et comparaisons de performance — économique vs premium.</p></div>
          <div class="res-item sec-tires"><a href="https://www.tirerack.com/tires/tests" target="_blank" rel="noopener">Résultats d'essais Tire Rack</a><p>Les propres résultats d'essais sur piste de Tire Rack, réalisés sur de vraies voitures (BMW M2, Tesla Model 3 et autres). Croisés avec Tyre Reviews ci-dessous, puisque des marques performantes comme Falken et Toyo ressortent davantage ici.</p></div>
          <div class="res-item sec-tires"><a href="https://youtu.be/UThaFOKi21g?si=cQExEa5c26JU1P1h" target="_blank" rel="noopener">Current Best Tires for 2025/26</a><p>Vidéo récapitulative des meilleurs pneus par catégorie.</p></div>
          <div class="res-item sec-tires"><a href="https://www.youtube.com/@tyrereviews" target="_blank" rel="noopener">Tyre Reviews — YouTube</a><p>Couverture vidéo continue des essais comparatifs et des nouveaux lancements de pneus.</p></div>
          <details class="sub theme-standard">
            <summary><span class="summary-txt">Liste complète des sources</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">Toutes les sources croisées durant la recherche et la vérification des classements ci-dessous, en plus des quatre sources principales ci-dessus.</p>
              <div class="item sd1"><div class="item-top"><div class="item-name">AutoBild</div></div><p class="note">Essais comparatifs été et quatre-saisons annuels de la publication allemande — cités pour les classements Grand Tourisme Été et Milieu de gamme.</p></div>
              <div class="item sd2"><div class="item-top"><div class="item-name">DEKRA (via une comparaison citée par Pirelli)</div></div><p class="note">Organisme d'essais indépendant européen — source des données de freinage combiné sec+mouillé+neige utilisées pour classer la catégorie Tout-Temps.</p></div>
              <div class="item sd3"><div class="item-top"><div class="item-name">Données d'essais publiées par les fabricants</div></div><p class="note">Résultats d'essais tête-à-tête de Michelin, Continental, Goodyear et Bridgestone, utilisés seulement lorsque corroborés par au moins une source indépendante.</p></div>
              <div class="item sd4"><div class="item-top"><div class="item-name">Données d'essais SimpleTire et AAA</div></div><p class="note">Données de comparaison de pneus indépendantes, particulièrement pour les classements Tourisme Premium/Standard et Route de camion.</p></div>
              <div class="item sd5"><div class="item-top"><div class="item-name">Consumer Reports et Car Talk</div></div><p class="note">Essais de pneus et classification de catégories indépendants, utilisés pour vérifier le positionnement Tourisme Standard vs Premium.</p></div>
              <div class="item sd6"><div class="item-top"><div class="item-name">ADAC</div></div><p class="note">Le plus grand club automobile d'Allemagne — mène certains des essais comparatifs indépendants de pneus les plus rigoureux en Europe, cités via la couverture de Tyre Reviews.</p></div>
              <div class="item sd7"><div class="item-top"><div class="item-name">AutoView</div></div><p class="note">Publication d'essais européenne citée pour les résultats d'essais comparatifs UHP été et quatre-saisons, via la couverture organisée de Tyre Reviews.</p></div>
            </div>
          </details>
        </div>
      </details>

      <details class="acc">
        <summary><span class="summary-txt">De quel type de pneu avez-vous vraiment besoin?</span><span class="count-tag">à lire avant les classements</span></summary>
        <div class="acc-body">
          <p class="card-sub" style="margin-top:-4px;">Un véritable guide sur ce que chaque catégorie de cette page signifie vraiment et à qui elle profite réellement — pas un classement, organisé par type de véhicule tout comme les classements ci-dessous.</p>

          <div id="tire-finder-root">${tireFinderHTML()}</div>

          <div class="item"><div class="item-top"><div class="item-name">Quatre-saisons (général)</div></div><p class="note">L'étiquette par défaut installée d'usine dans presque toutes les catégories ci-dessous, et honnêtement le nom le plus survendu de l'industrie — « quatre-saisons » signifie en réalité « trois saisons ». Sans certification 3PMSF spécifique, aucun composé propre au froid ni bande de roulement dédiée à la glace, donc l'adhérence par temps froid est tout juste correcte. Convient à un climat doux avec de la neige rare et légère. Rien à voir avec un vrai hiver, peu importe le palier tourisme/performance auquel il est associé.</p></div>

          <div class="item mr1"><div class="item-top"><div class="item-name">Marques milieu de gamme fiables (général)</div></div><p class="note">Pour qui : les acheteurs soucieux du budget de n'importe quel type de véhicule qui veulent tout de même un pneu qui rivalise véritablement avec les options premium. La valeur de ces marques s'est démontrée spécifiquement dans les essais Highway Terrain, mais leur réputation de dépasser leur gamme de prix s'étend aux voitures de tourisme, VUS et camions — pas une catégorie étroite propre à un seul véhicule comme les autres sur cette page.</p></div>

          <div class="item rf1"><div class="item-top"><div class="item-name">Pneus increvables / Run-Flat (général)</div></div><p class="note">Un flanc renforcé permet au pneu de soutenir le poids du véhicule sur une courte distance (habituellement ~80 km à un maximum de 80 km/h) après une perte totale de pression, évitant un changement de pneu sur le bord de la route. Le choix rétrécit véritablement à mesure que le poids du véhicule augmente : les voitures de tourisme ont la gamme run-flat la plus étendue (équipement d'origine standard sur la plupart des BMW et Mini), les options run-flat pour VUS existent mais sont nettement plus limitées — certaines gammes de pneus n'offrent tout simplement pas de version run-flat de leur produit VUS — et les camions n'ont essentiellement aucune catégorie run-flat grand public, puisque la rigidité de flanc supplémentaire nécessaire pour soutenir un tel poids nuirait à la flexibilité dont les camions ont besoin pour le remorquage et le hors route. Si votre véhicule est sorti d'usine avec des pneus run-flat, restez avec des run-flat — mélanger un pneu run-flat et un pneu conventionnel sur le même essieu n'est pas recommandé.</p></div>

          <details class="sub theme-guide" open>
            <summary><span class="summary-txt">Voiture de tourisme</span></summary>
            <div class="sub-body">
              <div class="item sd1"><div class="item-top"><div class="item-name">Tourisme Standard</div></div><p class="note">Pour qui : les conducteurs soucieux du budget qui veulent simplement se rendre d'un point A à un point B de façon fiable. Compétent mais sans éclat dans chaque catégorie — le compromis pour le prix le plus bas de la famille tourisme. Meilleur rapport bénéfice-prix si la performance ne compte pas et que seul le transport prévisible et sûr importe. Généralement la profondeur de bande de roulement neuve la plus profonde de tous les paliers tourisme — habituellement 10-12/32 po, donc la plus longue durée de vie avant remplacement.</p></div>
              <div class="item pt1"><div class="item-top"><div class="item-name">Tourisme Premium</div></div><p class="note">Pour qui : les conducteurs qui veulent la conduite quotidienne la plus agréable possible — habitacle plus silencieux, usure plus lente, souvent une meilleure adhérence mouillée — sans payer pour de la performance qu'ils n'utiliseront jamais. Le pas naturel au-dessus du Tourisme Standard quand le budget le permet.</p></div>
              <div class="item gt1"><div class="item-top"><div class="item-name">Grand Tourisme (Été)</div></div><p class="note">Pour qui : les conducteurs qui veulent un caractère nettement plus sportif que n'importe quel pneu tourisme, tout en gardant le confort et le silence d'une conduite quotidienne — ce qu'un pneu de la famille tourisme offre de plus proche d'un pneu performance. Été seulement, donc un plan hiver s'impose en complément. La profondeur de bande de roulement neuve est habituellement de 9-11/32 po — un peu moins que le Tourisme Standard en échange du caractère plus sportif.</p></div>
              <div class="item pf1"><div class="item-top"><div class="item-name">Performance (UHP été/UUHP)</div></div><p class="note">Pour qui : les passionnés et propriétaires de voitures sport qui veulent l'adhérence sec/mouillé maximale et n'ont pas d'objection à un second jeu pour l'hiver. Le composé souple durcit et perd son adhérence sous environ 7 °C — véritablement dangereux au froid, pas seulement « moins bon » — donc ce choix n'a de sens qu'avec un vrai pneu d'hiver en complément pour quiconque hors d'un climat chaud. La profondeur de bande de roulement neuve est habituellement la plus mince de tous les paliers tourisme/performance — environ 7-9/32 po — puisqu'un composé plus souple et plus adhérent s'use plus vite.</p></div>
              <div class="item pa1"><div class="item-top"><div class="item-name">Performance Quatre-Saisons</div></div><p class="note">Pour qui : les conducteurs qui veulent la majeure partie de cette adhérence et tenue de route UHP avec une saison utilisable plus longue qu'un pneu été pur — pas une façon d'éviter complètement le changement saisonnier, toujours pas recommandé pour la conduite hivernale réelle, mais le composé flexible au froid tient jusqu'à environ -5 °C contre un seuil d'environ 7 °C pour un pneu UHP été, donc il s'étend plus loin dans le froid de mi-saison avant qu'un changement soit vraiment nécessaire. Sacrifie aussi une partie de l'adhérence maximale pour une économie de carburant et une durée de vie de bande de roulement nettement meilleures qu'un vrai pneu UHP été — habituellement 8-10/32 po neuf contre 7-9/32 po pour l'UHP.</p></div>
              <div class="item aw1"><div class="item-top"><div class="item-name">Tout-Temps</div></div><p class="note">Pour qui : le pneu qui mérite vraiment la promesse « quatre-saisons » — certifié 3PMSF, véritablement capable en neige légère à modérée, utilisable à l'année sans changement saisonnier. Le meilleur choix pour les conducteurs à plus faible kilométrage dans un climat hivernal modéré; voir les conseils selon le kilométrage ci-dessous pour savoir exactement quand ceci devance un jeu d'hiver dédié.</p></div>
              <div class="item t1"><div class="item-top"><div class="item-name">Hiver / Neige</div></div><p class="note">Pour qui : quiconque roule de façon significative durant un vrai hiver — neige régulière, glace, froid soutenu. Rien d'autre sur cette page ne s'approche de l'adhérence sur neige et glace d'un pneu d'hiver dédié, et c'est exactement cet écart qui protège davantage un conducteur hivernal à haut kilométrage.</p></div>
              <div class="callout callout-c">
                <b>C'est votre kilométrage qui devrait trancher, pas seulement où vous habitez.</b> Si vous parcourez moins d'environ 10 000 km par année, un pneu Tout-Temps est très probablement le meilleur choix plutôt que deux jeux dédiés — l'avantage d'adhérence supplémentaire d'un vrai pneu d'hiver ne devient rentable que lorsque vous accumulez réellement de la distance en conditions hivernales véritables, et pour une faible utilisation annuelle, le coût, le tracas et l'entreposage de deux changements par année n'en valent généralement pas la peine. Si vous roulez beaucoup et voyez un vrai hiver — neige régulière, glace, froid soutenu — des jeux été et hiver dédiés en valent la peine : l'avantage neige/glace d'un pneu d'hiver par rapport à un bon pneu Tout-Temps s'accumule considérablement plus vous roulez réellement dans ces conditions, et c'est justement le conducteur à haut kilométrage qui en profite le plus.
              </div>
            </div>
          </details>

          <details class="sub theme-guide">
            <summary><span class="summary-txt">VUS / Multisegment</span></summary>
            <div class="sub-body">
              <div class="callout gold">Les VUS mélangent véritablement les deux mondes : les catégories Voiture de tourisme ci-dessus (Grand Tourisme, Performance, Performance Quatre-Saisons, Tout-Temps, Hiver) s'appliquent directement aux VUS aussi, en dimensions VUS/multisegment — elles ne sont pas exclusives aux berlines. Les deux catégories ci-dessous sont celles qui sont véritablement propres aux VUS.</div>
              <div class="item su1"><div class="item-top"><div class="item-name">Tout-terrain</div></div><p class="note">Pour qui : les propriétaires de multisegments/VUS qui quittent occasionnellement la route pavée — entrées de gravier, chemins forestiers, sentier léger — sans vouloir le bruit ou la pénalité de consommation d'un vrai pneu hors route. Conçu spécifiquement pour une plateforme multisegment plus légère, pas simplement une version réduite d'un pneu de camion.</p></div>
              <div class="item uh1"><div class="item-top"><div class="item-name">Route</div></div><p class="note">Pour qui : les propriétaires de VUS/multisegments qui restent sur route pavée et veulent un pneu conçu pour le poids supplémentaire et le cas de charge propre à un VUS, pas un pneu tourisme de voiture étiré pour s'ajuster. Priorise généralement une adhérence mouillée qui tient bon à mesure que le pneu s'use.</p></div>
            </div>
          </details>

          <details class="sub theme-guide">
            <summary><span class="summary-txt">Camion (châssis séparé)</span></summary>
            <div class="sub-body">
              <div class="item at1"><div class="item-top"><div class="item-name">Tout-terrain (LT)</div></div><p class="note">Pour qui : les propriétaires de camions qui vont véritablement hors route régulièrement — gravier, terre, roche, boue — et acceptent d'échanger un peu de silence routier et d'économie de carburant contre cette capacité. Ce n'est pas un pneu d'hiver, même avec le symbole 3PMSF sur le flanc — voir l'encadré démystificateur ci-dessous, car c'est l'une des méprises les plus courantes et les plus dangereuses sur la route.</p></div>
              <div class="callout callout-b">
                <b>Le mythe du tout-terrain en hiver.</b> Beaucoup d'acheteurs de pneus AT présument que le symbole montagne-flocon fait de leur camion « essentiellement un véhicule d'hiver », puis se retrouvent dans le fossé à la première vraie tempête de neige. Voici pourquoi : la certification 3PMSF ne teste que l'accélération sur neige moyennement tassée — elle ne teste ni le freinage, ni la tenue de route, ni la glace (l'explication officielle de Tire Rack le confirme directement). Les pneus AT utilisent aussi un composé de caoutchouc plus dur, conçu pour la durabilité sur gravier/roche, qui raidit et perd de l'adhérence au froid de la même façon qu'un pneu été, et ils ont beaucoup moins de lamelles (les petites fentes qui mordent la glace) qu'un vrai pneu d'hiver. Le pneu AT certifié 3PMSF surpassera un pneu quatre-saisons ordinaire dans la neige — ça, c'est réel. Il ne freinera pas et ne tournera pas comme un pneu d'hiver dédié sur glace ou neige tassée, et le traiter comme tel est exactement ce qui mène les gens à glisser dans une intersection ou hors route pendant une tempête.
              </div>
              <div class="item hw1"><div class="item-top"><div class="item-name">Route standard (LT)</div></div><p class="note">Pour qui : les propriétaires de camions qui restent presque entièrement sur route pavée — navettage, transport léger — et veulent le silence, une usure lente et une meilleure économie de carburant plutôt qu'une capacité hors route qu'ils n'utiliseront jamais.</p></div>
              <div class="item hy1"><div class="item-top"><div class="item-name">Route hybride / sentier (LT)</div></div><p class="note">Pour qui : le propriétaire de camion qui veut le confort de la Route standard la plupart du temps, mais a occasionnellement besoin d'une capacité hors route légère — gravier, chemins forestiers, sentier léger — sans s'engager dans une bande de roulement Tout-terrain complète et ses compromis de bruit/consommation.</p></div>
              <div class="item hd1"><div class="item-top"><div class="item-name">Route robuste (LT)</div></div><p class="note">Pour qui : les propriétaires de camionnettes de série 2500/3500 qui remorquent ou transportent régulièrement une vraie charge — ce segment est renforcé spécifiquement pour ce cas de charge, pas simplement un pneu Route standard dans un plus grand format.</p></div>
              <div class="item lw1"><div class="item-top"><div class="item-name">Hiver (LT)</div></div><p class="note">Pour qui : les propriétaires de camions qui font face à un vrai hiver tout en remorquant ou transportant — un composé et une construction d'hiver LT dédiés gèrent la charge en neige et glace d'une façon qu'aucun pneu quatre-saisons ou tout-terrain LT ne peut égaler.</p></div>
            </div>
          </details>
        </div>
      </details>

      <details class="acc" id="acc-rankings">
        <summary><span class="summary-txt">Meilleures marques de pneus — par catégorie</span><span class="count-tag">selon les essais de Tyre Reviews et Tire Rack</span></summary>
        <div class="acc-body">
          <p class="card-sub" style="margin-top:-4px;">Organisé par type de véhicule, puisqu'une voiture de tourisme, un VUS multisegment et un camion à châssis séparé ne magasinent rarement dans le même éventail de pneus. Le Top 10 composite et les Marques à éviter demeurent neutres, puisque la force des marques là-bas n'est pas propre à une seule plateforme.</p>

          <details class="sub theme-top10">
            <summary><span class="summary-txt">Top 10 composite — Ensemble</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">Classées de 1 à 10 selon la constance avec laquelle chaque marque gagne ou se classe sur le podium dans plusieurs catégories, pas seulement un essai.</p>
              <div class="item tp1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note"><b>Polyvalente.</b> Gagne en quatre-saisons, été UUHP et tout-terrain — aucune autre marque ne domine autant de catégories à la fois.</p></div>
              <div class="item tp2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note"><b>Polyvalente.</b> Performance hiver/neige combinée au tourisme quatre-saisons quotidien — toujours sur le podium, rarement le maillon faible.</p></div>
              <div class="item tp3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note"><b>Polyvalente.</b> Polyvalence tout-temps (CrossClimate2) et hiver premium (Alpin / X-Ice) — le choix sûr et éprouvé par défaut.</p></div>
              <div class="item tp4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Falken</div></div><p class="note"><b>Spécialiste.</b> Sur le podium à la fois en tout-terrain (Wildpeak AT4W) et en performance de piste (Azenis RT660+) — une vraie double menace, pas seulement un choix économique.</p></div>
              <div class="item tp5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note"><b>Spécialiste.</b> Même double force que Falken — l'Open Country A/T III gagne en tout-terrain neigeux, le Proxes Sport 2 rivalise directement en essai été UUHP.</p></div>
              <div class="item tp6"><div class="item-top"><div class="item-name"><span class="rank-num">06</span>Goodyear</div></div><p class="note"><b>Spécialiste.</b> Spécialiste de la traction sur glace, appuyé par une solide gamme quatre-saisons.</p></div>
              <div class="item tp7"><div class="item-top"><div class="item-name"><span class="rank-num">07</span>Nokian</div></div><p class="note"><b>Spécialiste.</b> Spécialiste hiver/neige — testé dans les pays nordiques, et référence en tout-terrain hivernal dédié.</p></div>
              <div class="item tp8"><div class="item-top"><div class="item-name"><span class="rank-num">08</span>BFGoodrich</div></div><p class="note"><b>Spécialiste.</b> Référence tout-terrain — le pneu auquel les autres pneus AT sont comparés.</p></div>
              <div class="item tp9"><div class="item-top"><div class="item-name"><span class="rank-num">09</span>Bridgestone</div></div><p class="note"><b>Spécialiste.</b> Glace/neige hivernale (Blizzak) combinée à de véritables lettres de noblesse en performance UHP (Potenza).</p></div>
              <div class="item tp10"><div class="item-top"><div class="item-name"><span class="rank-num">10</span>Hankook</div></div><p class="note"><b>Économique.</b> Quatre-saisons et hiver à prix avantageux — rivalise directement avec le segment premium à prix moindre.</p></div>
            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-pc">
            <summary><span class="summary-txt">Voiture de tourisme</span><span class="count-tag">berlines, coupés</span></summary>
            <div class="acc-body">

              <details class="sub theme-standard" id="cat-standard">
                <summary><span class="summary-txt">Tourisme standard</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">L'option quotidienne par défaut : point A à B, usure décente, compétent mais sans éclat. Un cran sous le Tourisme Premium — sacrifie un peu de confort/silence/usure pour un prix nettement inférieur.</p>
                  <div class="item sd1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le Defender2 (et le Defender T+H sortant) est explicitement conçu et commercialisé comme pneu Tourisme Standard quatre-saisons — le propre essai « Standard Touring All-Season » de Tire Rack l'a utilisé comme référence de catégorie face à l'Assurance MaxLife.</p></div>
                  <div class="item sd2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Goodyear</div></div><p class="note">L'Assurance MaxLife2 est le rival direct du Defender2 dans ce même segment Tourisme Standard — légèrement en avance en tenue de route mouillée et en kilométrage de garantie (137 000 km contre 129 000 km), tandis que Michelin garde une légère avance en freinage mouillé.</p></div>
                  <div class="item sd3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Hankook</div></div><p class="note">Le Kinergy XP se démarque comme choix économique dans ce segment — une garantie de 121 000 km à un prix nettement inférieur au duo Michelin/Goodyear, sans chute majeure de performance.</p></div>
                  <div class="item sd4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Kumho</div></div><p class="note">Le Majesty 9 Solus TA91 est utilisé à répétition comme référence économique dans les comparatifs indépendants de Tourisme Standard — adhérence sèche/mouillée véritablement compétitive pour le prix.</p></div>
                  <div class="item sd5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Vredestein</div></div><p class="note">Le HiTrac All Season se situe solidement dans le peloton médian de ce segment selon les comparatifs indépendants — une marque moins connue, mais une option Tourisme Standard légitime à considérer.</p></div>
                </div>
              </details>

              <details class="sub theme-midtouring" id="cat-midtouring">
                <summary><span class="summary-txt">Tourisme milieu de gamme</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Distinct du Tourisme Standard ci-dessus : ce sont des marques réputées pour dépasser leur gamme de prix, pas les lignes de produits économiques des grandes marques elles-mêmes. Le véritable palier de la valeur.</p>
                  <div class="item mt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">Le Solus TA31 (et le plus récent TA51a) revient constamment comme meneur de valeur dans les comparatifs indépendants de pneus économiques — le meilleur rapport cote-prix de sa catégorie, avec une conduite maîtrisée qui ne semble pas fragile pour le prix.</p></div>
                  <div class="item mt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Hankook</div></div><p class="note">Le Kinergy PT est le choix axé kilométrage de ce segment — bruit routier et consommation de carburant réduits pour la conduite quotidienne, et un remplacement équivalent OEM prisé pour les propriétaires de Hyundai/Kia/Genesis.</p></div>
                  <div class="item mt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Le Sincera SN250 A/S affiche des scores remarquables d'adhérence mouillée et d'usure pour le prix, appuyés par des millions de kilomètres rapportés par les propriétaires — un choix judicieux pour les navetteurs à haut kilométrage.</p></div>
                  <div class="item mt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Cooper</div></div><p class="note">L'Evolution Tour est le choix axé confort de ce segment — Cooper se situe constamment dans la zone idéale entre prix et confiance selon les avis indépendants.</p></div>
                  <div class="item mt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nexen</div></div><p class="note">Le N'Priz AH5 est le choix à meilleure garantie à l'extrémité vraiment économique — un choix raisonnable pour qui veut le plus bas coût réel par pneu sans descendre vers des importations sans marque.</p></div>
                </div>
              </details>

              <details class="sub theme-premium" id="cat-premium">
                <summary><span class="summary-txt">Tourisme Premium</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Le cran au-dessus du Tourisme Standard : un habitacle plus silencieux, une usure plus lente, et souvent une meilleure adhérence mouillée ou une résistance au roulement plus faible pour l'économie de carburant — des pneus axés confort, homologués quatre-saisons, pour qui veut la conduite quotidienne la plus agréable sans payer pour de la performance qu'il n'utilisera jamais.</p>
                  <div class="item pt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">Le TrueContact Tour 54 est explicitement qualifié de pneu « Grand Touring premium » dans les comparatifs directs, et a devancé ses plus proches rivaux en tenue de route mouillée, contrôle hivernal et classement général dans deux essais Tire Rack distincts.</p></div>
                  <div class="item pt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Le Turanza QuietTrack se situe dans ce même segment premium — le plus fort en traction pure (SimpleScore de 9,7 contre 8,4) et en atténuation du bruit, le choix quand le silence d'habitacle est la priorité absolue.</p></div>
                  <div class="item pt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note">Le Primacy Tour A/S est le véritable pneu Tourisme Premium de Michelin (distinct du Defender2, de niveau Standard) — choisi comme équipement d'origine par Acura, Lexus, BMW, Mercedes-Benz et Cadillac spécifiquement pour son dessin de bande de roulement silencieux.</p></div>
                  <div class="item pt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Yokohama</div></div><p class="note">L'AVID Ascend GT rivalise directement dans ce même segment — bonne adhérence en sec et en mouillé, ainsi que de bonnes manières en neige légère pour un pneu tourisme non certifié 3PMSF.</p></div>
                  <div class="item pt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Pirelli</div></div><p class="note">Le P7 AS Plus 3 complète le peloton Grand Touring quatre-saisons de Tire Rack aux côtés de solides concurrents — un choix fiable axé sur le confort, bien qu'avec moins de données d'essais tête-à-tête disponibles que les quatre premiers.</p></div>
                </div>
              </details>

              <details class="sub theme-grandtouring" id="cat-grandtouring">
                <summary><span class="summary-txt">Grand Tourisme (Été)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Encore un cran au-dessus en performance et adhérence pure par rapport au Tourisme Premium, tout en conservant le confort et un habitacle silencieux — ce qu'un pneu de la famille tourisme offre de plus proche d'un pneu performance sans sacrifier les qualités quotidiennes. Été seulement, pas quatre-saisons.</p>
                  <div class="item gt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">Le PremiumContact 7 domine le segment depuis son lancement en 2023, remportant 11 comparatifs directs sur 12 face au Michelin Primacy 4+, avec un freinage mouillé et des temps au tour mouillés de premier ordre.</p></div>
                  <div class="item gt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Pirelli</div></div><p class="note">Le Cinturato C3, le plus récent, a essentiellement égalé le PremiumContact 7 en cote générale — il devance même le Continental en freinage sec, tenue de route et bruit d'habitacle, faisant de cette rivalité une vraie lutte plutôt qu'une victoire écrasante.</p></div>
                  <div class="item gt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Le Turanza T005 est considéré parmi les plus solides du segment dans l'ensemble, reconnu pour un coefficient de résistance au roulement particulièrement faible — le choix si l'économie de carburant compte autant que l'adhérence.</p></div>
                  <div class="item gt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">L'Eagle F1 Asymmetric 6 a remporté tous les essais de presse européens auxquels il a participé depuis son lancement en 2022 — particulièrement fort face au Turanza T005 en adhérence sèche et mouillée pure, bien qu'à la traîne en confort et résistance au roulement.</p></div>
                  <div class="item gt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Michelin</div></div><p class="note">Le Primacy 4+ accuse un retard face au reste du peloton dans la plupart des comparatifs directs, mais conserve un réel avantage en confort et en raffinement à long terme à mesure que le pneu s'use — le choix pour qui privilégie cela à l'adhérence pure.</p></div>
                </div>
              </details>

              <details class="sub theme-performance" id="cat-performance">
                <summary><span class="summary-txt">Performance (UHP été / UUHP)</span></summary>
                <div class="sub-body">
                  <div class="item pf1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Le P Zero a été le grand gagnant de l'essai été ultra-haute performance 2026 de Tyre Reviews.</p></div>
                  <div class="item pf2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div></div><p class="note">Le Pilot Sport 5 demeure l'un des pneus UHP les plus testés et recommandés; le Pilot Sport Cup 2 a servi de référence piste dans le même essai UUHP.</p></div>
                  <div class="item pf3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Le Potenza RE-71RS demeure une référence parmi les pneus piste homologués route, régulièrement utilisé comme point de comparaison dans les propres essais de compétition de Tire Rack.</p></div>
                  <div class="item pf4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Falken</div></div><p class="note">Les Azenis RT660 / RT660+ se retrouvent régulièrement dans les propres essais de compétition de Tire Rack, aux côtés du Bridgestone Potenza RE-71RS et du Michelin Pilot Sport Cup 2 — une vraie place de choix pour la piste, pas seulement une option économique.</p></div>
                  <div class="item pf5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">Le Proxes Sport 2 a bien tenu tête dans l'essai été UUHP 2026 de Tire Rack, face au Falken FK510, au BFGoodrich g-Force Phenom TA, au Sumitomo HTR Z5 et au Nitto NT555 G2.</p></div>
                </div>
              </details>

              <details class="sub theme-perfas" id="cat-perfas">
                <summary><span class="summary-txt">Performance Quatre-Saisons</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Adhérence ultra-haute performance combinée à un composé quatre-saisons flexible au froid — ce qui se rapproche le plus de la tenue de route et du freinage d'un pneu UHP été, avec une saison utilisable plus longue qu'un pneu été pur, bien qu'encore un cran sous l'adhérence maximale d'un vrai pneu été et toujours pas un substitut à de vrais pneus d'hiver une fois la neige arrivée.</p>
                  <div class="item pa1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">L'ExtremeContact DWS06 Plus est largement considéré comme le meilleur généraliste du segment pour la conduite mixte réelle — meilleure tenue de route, réponse de direction et raffinement d'habitacle que son plus proche rival dans près d'une douzaine de comparatifs directs.</p></div>
                  <div class="item pa2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div></div><p class="note">Le Pilot Sport All Season 4 est le spécialiste des chiffres de freinage — distances d'arrêt les plus courtes en sec et en mouillé dans la plupart des essais tête-à-tête, le choix si la performance de freinage d'urgence est la priorité.</p></div>
                  <div class="item pa3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Goodyear</div></div><p class="note">L'Eagle F1 All Season a été l'un des meilleurs résultats du propre essai UHPAS à 5 pneus de Tire Rack sur une Tesla Model 3, devançant le Michelin sur route.</p></div>
                  <div class="item pa4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Bridgestone</div></div><p class="note">Le Potenza Sport AS a aussi terminé en tête du peloton dans ce même essai Tire Rack — un véritable candidat au podium, pas seulement un élément de remplissage.</p></div>
                  <div class="item pa5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Pirelli</div></div><p class="note">Le P Zero All Season Plus a mené le groupe en tenue de route sèche dans un autre essai UHPAS de Tire Rack — une bonne option côté disponibilité de tailles et adhérence, bien que moins souvent présent dans les essais tête-à-tête que les quatre premiers.</p></div>
                </div>
              </details>

              <details class="sub theme-allweather" id="cat-allweather">
                <summary><span class="summary-txt">Tout-Temps</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Pneus certifiés 3PMSF conçus pour gérer des conditions hivernales légères à modérées à l'année, sans changement saisonnier — un vrai pas au-dessus du quatre-saisons ordinaire, mais pas un substitut aux pneus d'hiver dédiés dans les climats à forte neige/glace. Classés selon la distance de freinage combinée sec + mouillé + neige d'une comparaison indépendante DEKRA.</p>
                  <div class="item aw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Le Cinturato All Season SF3 a affiché la meilleure distance de freinage combinée (72,8 m au total en sec, mouillé et neige) face à quatre pneus tout-temps rivaux — aussi coté A pour l'adhérence mouillée sur l'étiquette européenne des pneus.</p></div>
                  <div class="item aw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Le Turanza All Season 6 a terminé deuxième de justesse dans la même comparaison (73,1 m combinés).</p></div>
                  <div class="item aw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note">Le CrossClimate2 demeure le pneu tout-temps le plus connu en Amérique du Nord — 3e à cet essai de freinage combiné (74,6 m), et toujours l'une des options quatre-saisons les plus recommandées.</p></div>
                  <div class="item aw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Continental</div></div><p class="note">L'AllSeasonContact 2 s'est classé 4e ici (75,5 m combinés) — mais a remporté l'essai été quatre-saisons 2025 d'AutoBild haut la main, un rappel que les classements varient selon la méthodologie d'essai.</p></div>
                  <div class="item aw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Goodyear</div></div><p class="note">L'Assurance WeatherReady2 est le pneu tout-temps certifié 3PMSF de Goodyear, testé directement contre le CrossClimate2 par Goodyear lui-même — bon freinage mouillé (1,6 m plus court que des pneus comparables), sans toutefois être le meneur absolu de cette comparaison DEKRA précise.</p></div>
                </div>
              </details>

              <details class="sub theme-winter" id="cat-winter">
                <summary><span class="summary-txt">Hiver / Neige</span></summary>
                <div class="sub-body">
                  <div class="item t1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">Le VikingContact 8 a remporté l'essai nordique sans clous 2025/26 de Tyre Reviews haut la main — résultats constants en neige, glace, pluie, sec, bruit et résistance au roulement.</p></div>
                  <div class="item t2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div><span class="status-pill new">Nouveau pour 2026</span></div><p class="note">Le X-Ice Snow+ arrive pour la saison hivernale 2026 — amélioration de la performance et de la durabilité par rapport au X-Ice Snow, plus la technologie Piano Acoustic Tuning pour un roulement plus silencieux. Le Pilot Alpin PA4 demeure leur option hiver performance.</p></div>
                  <div class="item t3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div><span class="status-pill new">Nouveau pour 2026</span></div><p class="note">Le Blizzak IcePeak est le nouveau pneu hiver phare, lancé à l'échelle nationale en mai 2026 — premier Blizzak à obtenir à la fois les certifications 3-Peak Mountain Snowflake et Ice Grip, remplaçant les WS90 et DM-V2.</p></div>
                  <div class="item t4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Nokian</div></div><p class="note">Le Hakkapeliitta R5 a affiché la meilleure distance de freinage et le meilleur temps au tour dans l'essai neige de Tyre Reviews — la référence pour voiture de tourisme, distincte du Hakkapeliitta LT3 homologué LT conçu pour les camions.</p></div>
                  <div class="item t5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Goodyear</div></div><p class="note">L'Ultra Grip Ice WRT est le pneu glace/neige cloutable dédié de Goodyear pour l'Amérique du Nord. L'UltraGrip Ice 3, qui a obtenu de bons résultats de freinage sur glace dans le même essai, est un pneu du marché européen/nordique non vendu ici — le WRT utilise une technologie de bande de roulement similaire axée sur la glace et demeure une option hivernale fiable au Canada.</p></div>
                  <div class="callout"><b>Remarque :</b> ni le X-Ice Snow+ ni le Blizzak IcePeak n'ont encore été soumis à un essai comparatif de Tyre Reviews — les deux sont tout nouveaux pour la saison 2026. À surveiller jusqu'à un essai tête-à-tête.</div>
                </div>
              </details>

              <details class="sub theme-midwinter" id="cat-midwinter">
                <summary><span class="summary-txt">Hiver milieu de gamme</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Une véritable capacité hivernale — certifié 3PMSF, cloutable dans la plupart des cas — à un vrai rabais par rapport au segment phare ci-dessus. Pas un substitut au segment supérieur dans les climats les plus rudes, mais une option de valeur légitime pour la plupart des conducteurs hivernaux.</p>
                  <div class="item mw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Nokian</div></div><p class="note">Le Nordman North 9 est la propre sous-marque économique de Nokian, lancée spécifiquement pour rendre leur technologie de pneu d'hiver nordique accessible à un prix plus abordable.</p></div>
                  <div class="item mw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Hankook</div></div><p class="note">Le Winter i*cept RS3 offre une bonne performance sur neige et un bon freinage mouillé à un prix très compétitif — cité à répétition comme le meneur du milieu de gamme dans les essais européens indépendants.</p></div>
                  <div class="item mw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Yokohama</div></div><p class="note">L'iceGUARD G075 est un performant éprouvé avec une couverture de dimensions particulièrement large, facile à trouver pour la plupart des tailles de véhicules.</p></div>
                  <div class="item mw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">L'AltiMAX Arctic 12 est prêt pour les clous et économique — traction confiante sur neige et glace avec une large couverture de dimensions, sans l'étiquette de prix du segment premium.</p></div>
                  <div class="item mw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Vredestein</div></div><p class="note">Le Wintrac performe bien dans la neige et demeure notablement silencieux pour sa gamme de prix.</p></div>
                </div>
              </details>

              <details class="sub theme-runflat" id="cat-runflat">
                <summary><span class="summary-txt">Pneus increvables (Run-Flat)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Les voitures de tourisme ont la sélection run-flat la plus étendue de tous les types de véhicules — équipement d'origine standard sur la plupart des BMW et Mini. Le flanc renforcé soutient le véhicule sur environ 80 km à un maximum de 80 km/h après une perte totale d'air.</p>
                  <div class="item rf1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le Primacy MXM4 ZP mène en équilibre général — confort, adhérence mouillée et durée de vie de la bande de roulement, appuyé par plus de trois millions de kilomètres rapportés par les propriétaires. Le Pilot Sport All Season 4 ZP est leur option ZP axée performance pour qui ne veut pas sacrifier l'adhérence pour la sécurité run-flat.</p></div>
                  <div class="item rf2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Le DriveGuard Plus est cité à répétition comme le meilleur rapport qualité-prix run-flat — une véritable sécurité run-flat sans l'étiquette de prix premium, avec de solides conditions sèches et réponse de direction.</p></div>
                  <div class="item rf3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Continental</div></div><p class="note">Le ProContact GX SSR a affiché la meilleure performance hivernale parmi les run-flat dans les essais indépendants; le ProContact RX SSR est l'option SSR plus économique avec une disponibilité de dimensions de rechange plus large.</p></div>
                  <div class="item rf4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Pirelli</div></div><p class="note">Le Cinturato P7 All Season Run Flat apporte le confort tourisme et le faible bruit de Pirelli à la catégorie run-flat — conçu pour les berlines premium.</p></div>
                  <div class="item rf5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Le Ventus S1 noble2 HRS est l'alternative économique de ce groupe — réduit le coût sans trop sacrifier la tenue de route sèche/mouillée.</p></div>
                  <div class="callout">Ne présumez pas que tout pneu run-flat convient à votre voiture — plusieurs, surtout les options premium, sont spécifiques à l'équipement d'origine avec une disponibilité de dimensions limitée en dehors des véhicules exacts pour lesquels ils ont été conçus.</div>
                </div>
              </details>

            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-suv">
            <summary><span class="summary-txt">VUS / Multisegment</span><span class="count-tag">VUS, fourgonnettes</span></summary>
            <div class="acc-body">
              <p class="card-sub" style="margin-top:-4px;">Les VUS à châssis séparé (4Runner, Wrangler, Land Cruiser, Suburban/Tahoe) partagent le marché des pneus avec les camions — voir la section Camion à la place. Ceci couvre les multisegments et VUS intermédiaires, qui mélangent véritablement les types de pneus de voiture de tourisme et de camion.</p>

              <div class="callout gold">Le montage Grand Tourisme, Performance, Performance Quatre-Saisons, Tout-Temps et Hiver pour les VUS utilise exactement les mêmes classements de marques que Voiture de tourisme ci-dessus — les mêmes pneus (PremiumContact 7, CrossClimate2, VikingContact 8, X-Ice Snow+, etc.) sont simplement vendus en dimensions VUS/multisegment, alors le gagnant ne change pas.</div>

              <details class="sub theme-allterrain" id="cat-at-suv">
                <summary><span class="summary-txt">Tout-terrain</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Conçu spécifiquement pour les multisegments, pas des pneus de camion adaptés — ajusté pour une plateforme plus légère, nettement plus silencieux sur route, et non destiné à un usage hors route sérieux. Une gamme de produits entièrement différente des pneus Tout-terrain de camion ci-dessous.</p>
                  <div class="item su1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Falken</div></div><p class="note">Le Wildpeak A/T Trail a été conçu dès le départ pour les multisegments — remarquablement silencieux pour un pneu tout-terrain, avec de larges canaux d'évacuation d'eau lui donnant un réel avantage en adhérence mouillée que peu de pneus AT possèdent.</p></div>
                  <div class="item su2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">Le TerrainContact A/T est cité à répétition comme une réussite de catégorie spécifiquement pour les propriétaires de VUS multisegments — performance en neige exceptionnelle pour un pneu axé multisegment.</p></div>
                  <div class="item su3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>BFGoodrich</div></div><p class="note">Le Trail-Terrain T/A est l'alternative plus silencieuse et adaptée aux multisegments de BFGoodrich à leur gamme KO2/KO3 axée camion — conduite plus douce, moins de bruit routier, tout en restant véritablement capable hors route.</p></div>
                  <div class="item su4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Yokohama</div></div><p class="note">Le Geolandar (gamme multisegment) roule légèrement plus silencieusement et en douceur sur route que le Wildpeak A/T Trail dans certaines comparaisons de dimensions, au prix d'une protection de flanc et d'une capacité de neige moindres.</p></div>
                  <div class="item su5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">L'Open Country A/T III est aussi offert en véritables dimensions multisegments — l'option tout-terrain la plus polyvalente pour qui veut un seul pneu qui équilibre le confort d'un multisegment et une vraie capacité hors route.</p></div>
                </div>
              </details>

              <details class="sub theme-highway" id="cat-highway-suv">
                <summary><span class="summary-txt">Route</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Une gamme de produits véritablement distincte des pneus tourisme de voiture — conçue pour le poids supplémentaire et le cas de charge différent d'un VUS/multisegment, généralement avec un accent plus marqué sur l'adhérence mouillée qui tient bon à mesure que le pneu s'use.</p>
                  <div class="item uh1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le Premier LTX est conçu spécifiquement pour les VUS, multisegments et camionnettes légères, distinct du Primacy Tour A/S de voiture de tourisme — la technologie EverGrip utilise des rainures d'évacuation d'eau qui s'élargissent pour que le freinage mouillé reste solide même à mesure que le pneu s'use.</p></div>
                  <div class="item uh2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">Le CrossContact LX25 est le rival direct le plus souvent cité du Premier LTX dans cette catégorie — une alternative fiable et axée confort.</p></div>
                  <div class="item uh3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">L'Alenza A/S 02 est la gamme tourisme/route propre aux VUS de Bridgestone — axée confort, bien qu'avec moins de données d'essais tête-à-tête disponibles face aux deux premiers.</p></div>
                  <div class="item uh4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Pirelli</div></div><p class="note">Le Scorpion Verde A/S Plus complète le peloton avec l'option tourisme quatre-saisons pour VUS de Pirelli.</p></div>
                  <div class="item uh5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Le Dynapro HP2 est le choix économique de ce groupe — une option route pour VUS à coût moindre sans chute de performance majeure.</p></div>
                </div>
              </details>

              <details class="sub theme-midrange" id="cat-midrange-suv">
                <summary><span class="summary-txt">Milieu de gamme fiable (HT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Pneus Highway Terrain que Tyre Reviews qualifie eux-mêmes de « milieu de gamme » ou économiques dans leurs propres essais — véritablement compétitifs face aux pneus VUS/multisegment premium à prix moindre, selon leur classement réel.</p>
                  <div class="item mr1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">Le Crugen HT51 était « sur une autre planète » lors de l'essai HT 2026 de Tyre Reviews — a devancé la référence Michelin de 0,2 s en traction sur neige, se classant deuxième.</p></div>
                  <div class="item mr2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Firestone</div></div><p class="note">Le Destination LE3 a surpris dans le même essai en talonnant la référence du segment, le Michelin Defender LTX M/S2, au tour de tenue de route sur neige.</p></div>
                  <div class="item mr3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Cooper</div></div><p class="note">L'Endeavor Plus était l'un des deux pneus HT milieu de gamme (avec General) restés stables en conditions hivernales pour un pneu à vocation quatre-saisons.</p></div>
                  <div class="item mr4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">Le tout nouveau Grabber HT a tenu tête aux pneus HT milieu de gamme et premium établis, avec une tenue de route légèrement plus ludique à la limite.</p></div>
                  <div class="item mr5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Giti</div></div><p class="note">Une vraie surprise à l'essai été 2026 d'AutoBild — une marque qu'on ne classe pas normalement avec le segment premium, mais qui a obtenu d'assez bons résultats en mouillé et en sec pour rejoindre Hankook, Goodyear, Michelin et Pirelli dans la cote « exemplaire ».</p></div>
                  <div class="callout">Même le pneu économique choisi par Tyre Reviews — le Westlake SU318 HT — a montré à quel point les pneus bon marché ont progressé, se classant généralement dans le peloton plutôt que dernier au pointage global, même s'il accusait un retard sur certains essais comme l'accélération sur neige.</div>
                </div>
              </details>

              <details class="sub theme-runflat" id="cat-runflat-suv">
                <summary><span class="summary-txt">Pneus increvables (Run-Flat)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Une gamme véritablement différente et plus mince que les run-flat de voiture de tourisme — conçue spécifiquement pour le poids et la hauteur de caisse d'un VUS, pas un run-flat de voiture étiré dans une dimension plus grande. Certaines gammes de pneus n'offrent aucune version run-flat pour VUS.</p>
                  <div class="item rfs1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Le Scorpion Zero / Scorpion Verde All Season Run Flat a été conçu spécifiquement pour gérer le poids et la hauteur de caisse d'un VUS tout en gardant une tenue de route maîtrisée plutôt que vague ou flottante — équipement d'origine courant sur les BMW série X et Porsche Cayenne.</p></div>
                  <div class="item rfs2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Le Dueler H/P Sport RFT et le Dueler H/L 400 RFT utilisent une construction de bande de roulement à double couche spécifiquement pour gérer la charge supplémentaire d'un VUS plus lourd, avec la réponse de direction précise que recherchent les conducteurs.</p></div>
                  <div class="item rfs3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Continental</div></div><p class="note">Le CrossContact LX Sport SSR et le ContiSportContact 5 SUV SSR apportent la technologie Self-Supporting Runflat de Continental dans des dimensions véritablement propres aux VUS.</p></div>
                  <div class="item rfs4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Michelin</div></div><p class="note">La gamme Latitude (Tour HP ZP, Alpin LA2 ZP) et le Pilot Alpin 5 SUV ZP sont les véritables run-flat Zero Pressure propres aux VUS de Michelin, distincts de leur gamme ZP pour voiture de tourisme.</p></div>
                  <div class="item rfs5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Le Ventus S1 evo3 SUV K127C HRS est l'option économique dans les véritables dimensions run-flat pour VUS — une vraie alternative quand la sélection run-flat pour VUS des marques premium n'a pas votre dimension.</p></div>
                </div>
              </details>
            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-truck">
            <summary><span class="summary-txt">Camion</span><span class="count-tag">châssis séparé, homologué LT</span></summary>
            <div class="acc-body">
              <p class="card-sub" style="margin-top:-4px;">Couvre les camions et VUS à châssis séparé (F-150, Silverado, Ram, 4Runner, Wrangler, Land Cruiser, Suburban/Tahoe) — des produits plus robustes conçus pour une véritable capacité de charge et un usage hors route, pas les pneus plus légers axés multisegment ci-dessus.</p>

              <details class="sub theme-allterrain" id="cat-at-lt">
                <summary><span class="summary-txt">Tout-terrain (LT)</span></summary>
                <div class="sub-body">
                  <div class="item at1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Le Scorpion XTM AT a remporté l'essai tout-terrain 2026 de Tyre Reviews — le plus fort en tenue de route sur terre, tenue de route subjective sur terre, traction sur neige, tenue de route subjective sur neige et tenue de route subjective sur chaussée mouillée.</p></div>
                  <div class="item at2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Falken</div></div><p class="note">Le Wildpeak AT4W a remporté un comparatif direct (source Tire Rack) face au Toyo Open Country A/T III — meilleur freinage sur chaussée mouillée et résistance à l'aquaplanage de la catégorie, arrêts secs plus courts, roulement plus silencieux et meilleur contrôle sur terre.</p></div>
                  <div class="item at3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Toyo</div></div><p class="note">L'Open Country A/T III a pris l'avantage dans ce même comparatif une fois passé à la neige — meilleure tenue de route, traction et contrôle subjectif sur neige que le Wildpeak AT4W, malgré un freinage légèrement plus faible.</p></div>
                  <div class="item at4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>BFGoodrich</div></div><p class="note">Le All-Terrain KO3 est considéré comme la référence du segment dans plusieurs comparatifs tout-terrain de Tyre Reviews — le remplaçant direct du légendaire KO2.</p></div>
                  <div class="item at5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nokian</div></div><p class="note">L'Outpost nAT a été jugé le meilleur pneu tout-terrain pour les conditions hivernales — s'est démarqué au freinage sur glace, constant dans tous les essais.</p></div>
                  <div class="callout">Falken vs Toyo est une question de priorités : choisissez le Falken Wildpeak pour la tenue de route sur chaussée sèche/mouillée et le confort silencieux, choisissez le Toyo Open Country pour les climats très neigeux. Les deux sont certifiés 3-Peak Mountain Snowflake.</div>
                </div>
              </details>

              <details class="sub theme-highway" id="cat-highway-lt">
                <summary><span class="summary-txt">Route standard (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Pour les camions qui restent surtout sur route pavée — navettage, remorquage, transport — sans la bande de roulement hors route d'un pneu tout-terrain. Plus silencieux, usure plus lente, meilleure économie de carburant.</p>
                  <div class="item hw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le Defender LTX M/S2 affiche une distance de freinage mouillée dominante (41,6 m contre 49,7 m pour le Dueler H/L Alenza Plus, 52,0 m pour le Wrangler SR-A) et la meilleure cote de traction sur neige du groupe dans les propres essais publiés de Michelin.</p></div>
                  <div class="item hw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">Le TerrainContact H/T roule plus silencieusement que le Defender LTX avec un freinage mouillé légèrement meilleur selon les données d'essai indépendantes de l'AAA, et une résistance au roulement plus faible.</p></div>
                  <div class="item hw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Le Dueler H/L Alenza Plus offre la conduite la plus douce de cette catégorie, appuyée par une garantie de 129 000 km — la plus longue du groupe.</p></div>
                  <div class="item hw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">Le Wrangler Fortitude HT offre une conduite et un niveau de bruit presque identiques au Defender LTX M/S2, souvent pour nettement moins cher.</p></div>
                  <div class="item hw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Cooper</div></div><p class="note">Le Discoverer HT3 est le choix économique du groupe — égale la cote de neige sévère 3PMSF de la catégorie à un prix nettement inférieur, avec un flanc légèrement plus rigide qui est en fait un avantage pour les camions à PNBV plus élevé.</p></div>
                </div>
              </details>

              <details class="sub theme-midhighway" id="cat-midhighway">
                <summary><span class="summary-txt">Route milieu de gamme (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Un véritable palier de valeur sous la Route standard — de vrais pneus route homologués LT de marques établies, pas un pas vers des importations sans marque.</p>
                  <div class="item mh1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">Le Crugen HT51 se démarque par une usure solide et le meilleur score de neige de la gamme camion de Kumho — un excellent choix de valeur pour les propriétaires de camionnettes demi-tonne qui remorquent occasionnellement et veulent une capacité hivernale sans le bruit d'un pneu tout-terrain.</p></div>
                  <div class="item mh2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Yokohama</div></div><p class="note">Le Geolandar H/T4 (dimensions LT) mène ce segment en longévité, conçu pour un remorquage et un transport confiants avec une garantie de durée de vie de bande de roulement véritablement longue.</p></div>
                  <div class="item mh3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Le Wildpeak H/T02 complète ce segment de valeur — l'équilibre entre performance et prix abordable de Falken se démarque clairement aussi dans ce segment, pas seulement dans leur gamme AT.</p></div>
                  <div class="item mh4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">L'AltiMAX RT43 (dimensions compatibles LT) est une option de valeur fiable et largement disponible pour qui veut une marque connue sans la prime de prix de la Route standard.</p></div>
                  <div class="item mh5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Westlake</div></div><p class="note">La véritable extrémité économique de ce segment — la propre référence économique de Tyre Reviews dans les essais HT, montrant à quel point les pneus bon marché ont progressé, même s'il accuse un retard sur certains essais comme l'accélération sur neige.</p></div>
                </div>
              </details>

              <details class="sub theme-hybrid" id="cat-hybrid-lt">
                <summary><span class="summary-txt">Route hybride / sentier (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Un cran entre la Route standard et le Tout-terrain complet — confort et silence routiers la plupart du temps, avec une capacité hors route légère (gravier, chemins forestiers, sentier léger) au besoin, sans s'engager dans une bande de roulement AT agressive.</p>
