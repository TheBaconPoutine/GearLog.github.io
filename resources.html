<script src="shared.js"></script>
<script>
window.CURRENT_PAGE = "resources";

let finderState = { step: 0, answers: {} }; // transient tire-finder quiz state, not persisted

const FINDER_QUESTIONS = [
  { id: "vehicleType", options: ["car", "suv", "truck"] },
  { id: "offroad", visibleIf: a => a.vehicleType === "suv" || a.vehicleType === "truck", options: ["never", "occasional", "regular"] },
  { id: "towing", visibleIf: a => a.vehicleType === "truck", options: ["no", "occasional", "heavy"] },
  { id: "winter", options: ["mild", "moderate", "severe"] },
  { id: "mileage", options: ["low", "medium", "high"] },
  { id: "performance", options: ["max", "some", "none"] },
  { id: "noise", options: ["high", "medium", "low"] },
  { id: "fuelEconomy", options: ["high", "medium", "low"] },
  { id: "longevity", options: ["high", "medium", "low"] },
  { id: "budget", options: ["budget", "mid", "premium"] },
  { id: "runflat", visibleIf: a => a.vehicleType === "car" || a.vehicleType === "suv", options: ["yes", "no", "unsure"] },
];

function finderVisibleQuestions(answers){
  return FINDER_QUESTIONS.filter(q => !q.visibleIf || q.visibleIf(answers));
}

const CATEGORY_PROFILES = {
  // Each axis scored 1 (worst) to 5 (best) on that trait, based on real tread-life and
  // engineering tradeoffs: performance tiers trade tread life, quiet, and fuel economy for grip.
  standard:     { performance: 1, quiet: 3, fuelEconomy: 5, longevity: 5 }, // 10-12/32 new
  midtouring:   { performance: 1, quiet: 3, fuelEconomy: 4, longevity: 4 },
  premium:      { performance: 2, quiet: 5, fuelEconomy: 4, longevity: 4 },
  grandtouring: { performance: 3, quiet: 4, fuelEconomy: 3, longevity: 3 }, // 9-11/32 new
  perfas:       { performance: 4, quiet: 2, fuelEconomy: 2, longevity: 2 }, // 8-10/32 new
  performance:  { performance: 5, quiet: 1, fuelEconomy: 1, longevity: 1 }, // 7-9/32 new
};
const ANSWER_WEIGHT = { max: 3, some: 1, none: 0, high: 3, medium: 1, low: 0 };

function computeDailyCarCategory(a, pairWinter){
  // Winter and budget are decisive, near-binary signals — handle them as pre-filters first.
  if(a.winter === "moderate" || (a.winter === "severe" && a.mileage === "low")) return "allweather";
  if(a.budget === "budget") return "midtouring";

  // Everything else is a genuine tradeoff (grip vs. quiet vs. fuel economy vs. tread life),
  // so score every remaining category against how strongly the driver weighted each trait,
  // instead of letting one answer (like "max performance") silently override the rest.
  const weights = {
    performance: ANSWER_WEIGHT[a.performance] ?? 1,
    quiet: ANSWER_WEIGHT[a.noise] ?? 1,
    fuelEconomy: ANSWER_WEIGHT[a.fuelEconomy] ?? 1,
    longevity: ANSWER_WEIGHT[a.longevity] ?? 1,
  };

  let best = null, bestScore = -Infinity;
  for(const cat of Object.keys(CATEGORY_PROFILES)){
    const profile = CATEGORY_PROFILES[cat];
    const score = profile.performance * weights.performance
                + profile.quiet * weights.quiet
                + profile.fuelEconomy * weights.fuelEconomy
                + profile.longevity * weights.longevity;
    if(score > bestScore){ bestScore = score; best = cat; }
  }
  return best;
}

function computeFinderResult(a){
  const wantsRunFlat = a.runflat === "yes";

  if(a.vehicleType === "truck"){
    const pairWinter = a.winter === "severe";
    let dailyCat;
    if(a.towing === "heavy") dailyCat = "heavyduty";
    else if(a.offroad === "regular") dailyCat = "at-lt";
    else if(a.offroad === "occasional") dailyCat = "hybrid-lt";
    else dailyCat = a.budget === "budget" ? "midhighway" : "highway-lt";
    return { cat: dailyCat, jump: "rank-truck", pairWinter };
  }

  if(a.vehicleType === "suv"){
    if(a.offroad === "regular" || a.offroad === "occasional") return { cat: "at-suv", jump: "rank-suv" };
    if(a.budget === "budget") return { cat: "midrange-suv", jump: "rank-suv" };
    if(wantsRunFlat) return { cat: "runflat-suv", jump: "rank-suv" };
    const pairWinter = a.winter === "severe" && a.mileage !== "low";
    return { cat: computeDailyCarCategory(a, pairWinter), jump: "rank-pc", pairWinter };
  }

  // Passenger Car
  if(wantsRunFlat) return { cat: "runflat", jump: "rank-pc" };
  const pairWinter = a.winter === "severe" && a.mileage !== "low";
  return { cat: computeDailyCarCategory(a, pairWinter), jump: "rank-pc", pairWinter };
}

function renderFinderOnly(){
  const root = document.getElementById("tire-finder-root");
  if(root) root.outerHTML = tireFinderHTML();
}

function tireFinderHTML(){
  const visible = finderVisibleQuestions(finderState.answers);
  const total = visible.length;

  if(finderState.step === 0){
    return `
      <div class="finder-box" id="tire-finder-root">
        <div class="finder-start-row">
          <div>
            <div class="finder-question-title" style="margin-bottom:4px;">${t("finder.title")}</div>
            <p style="font-size:12.5px; color:var(--text-dim2); margin:0; line-height:1.5;">${t("finder.intro")}</p>
          </div>
          <button class="btn c-amber" type="button" data-action="finder-start">${t("finder.startBtn")}</button>
        </div>
      </div>
    `;
  }

  if(finderState.step > total){
    const result = computeFinderResult(finderState.answers);
    const resultData = t("finder.results")[result.cat];
    return `
      <div class="finder-box" id="tire-finder-root">
        <div class="finder-progress">${t("finder.resultIntro")}</div>
        <div class="finder-result-title">${resultData.title}</div>
        <p class="finder-result-reason">${resultData.reason}</p>
        ${result.pairWinter ? `<div class="callout" style="margin:0 0 16px;">${t("finder.pairWinterNote")}</div>` : ""}
        <div class="finder-actions">
          <button class="btn secondary" type="button" data-action="finder-restart">${t("finder.restartBtn")}</button>
          <button class="btn c-amber" type="button" data-action="finder-jump" data-key="${result.jump}" data-value="cat-${result.cat}">${t("finder.jumpBtn")}</button>
        </div>
      </div>
    `;
  }

  const q = visible[finderState.step - 1];
  const qData = t("finder.q")[q.id];
  const selected = finderState.answers[q.id];
  const pct = Math.round(((finderState.step - 1) / total) * 100);

  return `
    <div class="finder-box" id="tire-finder-root">
      <div class="finder-progress">${t("finder.stepOf")(finderState.step, total)}</div>
      <div class="finder-progress-bar"><div class="finder-progress-bar-fill" style="width:${pct}%;"></div></div>
      <div class="finder-question-title">${qData.title}</div>
      <div class="condition-choice">
        ${q.options.map(opt => `
          <div class="condition-option ${selected === opt ? "selected" : ""}" data-action="select-finder-answer" data-key="${q.id}" data-value="${opt}" role="button" tabindex="0">
            <div class="condition-option-label"><span class="condition-option-check"></span>${qData[opt]}</div>
          </div>
        `).join("")}
      </div>
      ${finderState.step > 1 ? `
        <div class="finder-actions">
          <button class="btn secondary" type="button" data-action="finder-back">${t("finder.backBtn")}</button>
        </div>
      ` : ""}
    </div>
  `;
}


function resourcesPageHTML(){
  return state.language === "fr" ? resourcesContentFR() : resourcesContentEN();
}

function resourcesContentEN(){
  return `
    <p style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim2); margin:0 0 20px;"><b style="color:var(--text);">Last updated:</b> Aug 19, 2026</p>

    <details class="res-section sec-tires" id="res-tires">
      <summary><h2>Tires</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub">Data sources, brand rankings by category, and mid-range picks worth trusting.</p>

      <details class="acc">
        <summary><span class="summary-txt">Tire Data &amp; Reviews</span><span class="count-tag">4 primary + sources list</span></summary>
        <div class="acc-body">
          <div class="res-item sec-tires">
            <a href="https://www.tyrereviews.com/" target="_blank" rel="noopener">Tyre Reviews</a>
            <p>Excellent database on tires with extensive resources, including documented tire tests, specs, and performance comparisons — cheap vs. premium.</p>
          </div>
          <div class="res-item sec-tires">
            <a href="https://www.tirerack.com/tires/tests" target="_blank" rel="noopener">Tire Rack Test Results</a>
            <p>Tire Rack's own test track results, run on real cars (BMW M2, Tesla Model 3, and others). Cross-referenced against Tyre Reviews below, since strong performers like Falken and Toyo show up more here.</p>
          </div>
          <div class="res-item sec-tires">
            <a href="https://youtu.be/UThaFOKi21g?si=cQExEa5c26JU1P1h" target="_blank" rel="noopener">Current Best Tires for 2025/26</a>
            <p>Video roundup of top tire picks across categories.</p>
          </div>
          <div class="res-item sec-tires">
            <a href="https://www.youtube.com/@tyrereviews" target="_blank" rel="noopener">Tyre Reviews — YouTube</a>
            <p>Ongoing video coverage of group tests and new tire launches.</p>
          </div>
          <details class="sub theme-standard">
            <summary><span class="summary-txt">Full Sources List</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">Every source cross-referenced while researching and fact-checking the rankings below, beyond the four primary ones above.</p>
              <div class="item sd1"><div class="item-top"><div class="item-name">AutoBild</div></div><p class="note">German publication's annual summer and all-season tire group tests — cited for Grand Touring Summer and Mid-Range placements.</p></div>
              <div class="item sd2"><div class="item-top"><div class="item-name">DEKRA (via Pirelli-cited comparison)</div></div><p class="note">Independent European testing body — source for the combined dry+wet+snow braking data used to rank the All-Weather category.</p></div>
              <div class="item sd3"><div class="item-top"><div class="item-name">Manufacturer-published test data</div></div><p class="note">Michelin, Continental, Goodyear, and Bridgestone's own head-to-head test results, used only where corroborated by at least one independent source.</p></div>
              <div class="item sd4"><div class="item-top"><div class="item-name">SimpleTire &amp; AAA test data</div></div><p class="note">Independent tire comparison data, particularly for Premium/Standard Touring and Truck Highway placements.</p></div>
              <div class="item sd5"><div class="item-top"><div class="item-name">Consumer Reports &amp; Car Talk</div></div><p class="note">Independent tire testing and category classification, used to verify Standard vs. Premium Touring tier placements.</p></div>
              <div class="item sd6"><div class="item-top"><div class="item-name">ADAC</div></div><p class="note">Germany's largest automobile club — runs some of the most rigorous independent tire group tests in Europe, cited via Tyre Reviews' coverage.</p></div>
              <div class="item sd7"><div class="item-top"><div class="item-name">AutoView</div></div><p class="note">European test publication cited for UHP summer and all-season group test results, via Tyre Reviews' curated coverage.</p></div>
            </div>
          </details>
        </div>
      </details>

      <details class="acc">
        <summary><span class="summary-txt">Which Tire Type Do You Actually Need?</span><span class="count-tag">read this before the rankings</span></summary>
        <div class="acc-body">
          <p class="card-sub" style="margin-top:-4px;">A proper guide to what every category on this page actually means and who genuinely benefits from it — not a ranking, organized by vehicle type just like the rankings below.</p>

          <div id="tire-finder-root">${tireFinderHTML()}</div>

          <div class="item"><div class="item-top"><div class="item-name">All-Season (general)</div></div><p class="note">The default OEM-fit label across almost every category below, and honestly the most oversold name in the industry — "all-season" really means "three-season." Without a 3PMSF certification specifically, there's no snow-specific rubber compound or dedicated ice tread, so cold-weather grip is just okay at best. Fine for a mild climate with rare, light snow. Not something to trust in a real winter, regardless of which touring/performance tier it's paired with.</p></div>

          <div class="item mr1"><div class="item-top"><div class="item-name">Reliable Mid-Range Brands (general)</div></div><p class="note">Who it's for: budget-conscious buyers of any vehicle type who still want a tire that genuinely competes with premium options. These brands' value showed up specifically in Highway Terrain testing, but their reputation for punching above their price extends across passenger car, SUV, and truck lines alike — not a narrow, vehicle-specific category the way the others on this page are.</p></div>

          <div class="item rf1"><div class="item-top"><div class="item-name">Run-Flat (general)</div></div><p class="note">A reinforced sidewall lets the tire support the vehicle's weight for a short distance (typically ~80 km at up to 80 km/h) after total air loss, avoiding a roadside tire change. Selection genuinely shrinks as vehicle weight goes up: passenger cars have the deepest run-flat lineup (standard OE fitment on most BMW and Mini models), SUV run-flat options exist but are noticeably thinner — some tire lines simply don't offer a run-flat version of their SUV product at all — and trucks essentially have no mainstream run-flat category, since the extra sidewall stiffness needed to support that much weight would fight against the flex trucks need for towing and off-road use. If your vehicle came from the factory on run-flats, stick with run-flats — mixing a run-flat and a conventional tire on the same axle is not recommended.</p></div>

          <details class="sub theme-guide" open>
            <summary><span class="summary-txt">Passenger Car</span></summary>
            <div class="sub-body">
              <div class="item sd1"><div class="item-top"><div class="item-name">Standard Touring</div></div><p class="note">Who it's for: budget-conscious daily commuters who just want to get from A to B reliably. Competent but unremarkable in every category — the tradeoff for the lowest price in the touring family. Best benefit-per-dollar if you don't care about performance and just want predictable, safe transportation. Typically the deepest new tread depth of any touring tier — usually 10-12/32", meaning the longest tread life before replacement.</p></div>
              <div class="item pt1"><div class="item-top"><div class="item-name">Premium Touring</div></div><p class="note">Who it's for: drivers who want the nicest possible daily-driver ride — quieter cabin, longer tread life, often better wet grip — without paying for performance they'll never use. The natural step up from Standard Touring once budget allows.</p></div>
              <div class="item gt1"><div class="item-top"><div class="item-name">Grand Touring (Summer)</div></div><p class="note">Who it's for: drivers who want a noticeably sportier feel than any touring tire offers, but still need daily-driver comfort and quiet — the closest a touring-family tire gets to performance-tire feel. Summer-only, so it needs a winter plan alongside it. New tread depth is typically 9-11/32" — a bit shallower than Standard Touring in exchange for the sportier feel.</p></div>
              <div class="item pf1"><div class="item-top"><div class="item-name">Performance (Summer UHP/UUHP)</div></div><p class="note">Who it's for: enthusiasts and sports-car owners who want maximum dry/wet grip and don't mind a second set of tires for winter. The soft compound goes hard and loses grip below roughly 7°C — genuinely unsafe in the cold, not just "less good," so this only makes sense paired with a real winter tire for anyone outside a warm climate. New tread depth is typically the shallowest of any touring/performance tier — around 7-9/32" — since a softer, grippier compound wears faster.</p></div>
              <div class="item pa1"><div class="item-top"><div class="item-name">Performance All-Season</div></div><p class="note">Who it's for: drivers who want most of that UHP grip and handling with a longer usable season than pure summer tires — not a way to skip the seasonal swap entirely, still not recommended for real winter driving, but the cold-flexible compound holds up down to roughly -5°C versus a Summer UHP tire's ~7°C cutoff, so it stretches further into shoulder-season cold before a swap is actually needed. Also trades some peak grip for meaningfully better fuel economy and tread life than a pure Summer UHP tire — typically 8-10/32" new versus UHP's 7-9/32".</p></div>
              <div class="item aw1"><div class="item-top"><div class="item-name">All-Weather</div></div><p class="note">Who it's for: the tire that actually earns the "all-season" promise — 3PMSF-certified, genuinely capable in light-to-moderate snow, usable year-round without a seasonal swap. The best fit for lower-mileage drivers in a moderate winter climate; see the mileage guidance below for exactly when this beats a dedicated winter set.</p></div>
              <div class="item t1"><div class="item-top"><div class="item-name">Winter / Snow</div></div><p class="note">Who it's for: anyone who drives a meaningful amount through a real winter — regular snow, ice, sustained cold. Nothing else on this page comes close to a dedicated winter tire's ice and snow grip, and that gap is exactly what keeps a higher-mileage winter driver safer.</p></div>
              <div class="callout callout-c">
                <b>How much you drive should decide this, not just where you live.</b> If you drive under roughly 10,000 km a year, an All-Weather tire is very likely the better call than running two dedicated sets — the incremental grip advantage of a proper winter tire only pays off once you're actually racking up real distance in genuine winter conditions, and for low-mileage driving the cost, hassle, and storage of swapping twice a year usually isn't worth it. If you drive a lot and see real winter — regular snow, ice, sustained cold — dedicated summer and winter sets are worth it: winter tires' ice/snow advantage over even a good All-Weather tire compounds significantly the more you're actually on the road in those conditions, and it's exactly the higher-mileage driver who benefits most from that gap.
              </div>
            </div>
          </details>

          <details class="sub theme-guide">
            <summary><span class="summary-txt">SUV / Crossover</span></summary>
            <div class="sub-body">
              <div class="callout gold">SUVs genuinely mix both worlds: the Passenger Car categories above (Grand Touring, Performance, Performance All-Season, All-Weather, Winter) apply directly to SUVs too, in CUV/SUV sizing — they're not exclusive to sedans. The two categories below are the ones that are genuinely SUV-specific.</div>
              <div class="item su1"><div class="item-top"><div class="item-name">All-Terrain</div></div><p class="note">Who it's for: crossover/CUV owners who occasionally leave pavement — gravel driveways, forest service roads, light trail — but don't want the noise or fuel penalty of a true off-road tire. Purpose-built for a lighter crossover platform, not just a smaller version of a truck tire.</p></div>
              <div class="item uh1"><div class="item-top"><div class="item-name">Highway</div></div><p class="note">Who it's for: SUV/crossover owners who stay on pavement and want a tire engineered for the extra weight and load case of an SUV specifically, not a passenger-car touring tire stretched to fit. Usually prioritizes wet grip that holds up as the tire wears.</p></div>
            </div>
          </details>

          <details class="sub theme-guide">
            <summary><span class="summary-txt">Truck (body-on-frame)</span></summary>
            <div class="sub-body">
              <div class="item at1"><div class="item-top"><div class="item-name">All-Terrain (LT)</div></div><p class="note">Who it's for: truck owners who genuinely go off-road regularly — gravel, dirt, rock, mud — and are willing to trade some on-road quiet and fuel economy for that capability. Not a winter tire, even with the 3PMSF symbol on the sidewall — see the myth-busting callout below, since this is one of the most common and dangerous misconceptions on the road.</p></div>
              <div class="callout callout-b">
                <b>The all-terrain winter myth.</b> A lot of AT tire buyers assume the mountain-snowflake symbol means their truck is "basically a winter vehicle" now, and then end up in a ditch the first time a real snowstorm hits. Here's why: 3PMSF certification only tests acceleration on medium-packed snow — it doesn't test braking, cornering, or ice at all (Tire Rack's own explainer confirms this directly). AT tires also use a harder rubber compound tuned for gravel/rock durability, which stiffens up and loses grip in the cold the same way a summer tire does, and they have far fewer sipes (the tiny slits that bite into ice) than a real winter tire. The 3PMSF-rated AT tire will out-perform a plain all-season tire in snow — that part is real. It will not stop or turn like a dedicated winter tire on ice or packed snow, and treating it like one is exactly how people end up sliding through an intersection or off the road in a storm.
              </div>
              <div class="item hw1"><div class="item-top"><div class="item-name">Standard Highway (LT)</div></div><p class="note">Who it's for: truck owners who stay almost entirely on pavement — commuting, light hauling — and want quiet, long tread life, and better fuel economy over any off-road capability they'll never use.</p></div>
              <div class="item hy1"><div class="item-top"><div class="item-name">Hybrid / Trail Highway (LT)</div></div><p class="note">Who it's for: the truck owner who wants Standard Highway comfort most of the time but occasionally needs light off-road capability — gravel, forest service roads, mild trail — without committing to a full All-Terrain tread and its noise/fuel tradeoffs.</p></div>
              <div class="item hd1"><div class="item-top"><div class="item-name">Heavy Duty Highway (LT)</div></div><p class="note">Who it's for: owners of 2500/3500-series trucks who regularly tow or haul real weight — this tier is reinforced specifically for that load case, not just a Standard Highway tire in a bigger size.</p></div>
              <div class="item lw1"><div class="item-top"><div class="item-name">Winter (LT)</div></div><p class="note">Who it's for: truck owners facing real winter who also tow or haul — a dedicated LT winter compound and construction handles load in snow and ice in a way no all-season or all-terrain LT tire can match.</p></div>
            </div>
          </details>
        </div>
      </details>

      <details class="acc" id="acc-rankings">
        <summary><span class="summary-txt">Top Tire Brands — By Category</span><span class="count-tag">via Tyre Reviews &amp; Tire Rack testing</span></summary>
        <div class="acc-body">
          <p class="card-sub" style="margin-top:-4px;">Organized by vehicle type, since a passenger car, a crossover SUV, and a body-on-frame truck rarely shop from the same tire lineup. Composite Top 10 and Brands to Avoid stay vehicle-agnostic since brand strength there isn't specific to one platform.</p>

          <details class="sub theme-top10">
            <summary><span class="summary-txt">Composite Top 10 — Overall</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">Ranked 1–10 by how consistently each brand wins or podiums across categories, not just one test.</p>
              <div class="item tp1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note"><b>All-Rounder.</b> Wins across all-season, UUHP summer, and all-terrain — no other brand tops that many categories at once.</p></div>
              <div class="item tp2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note"><b>All-Rounder.</b> Winter/snow performance plus daily all-season touring — consistently a podium finisher, rarely the weak link.</p></div>
              <div class="item tp3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note"><b>All-Rounder.</b> All-weather versatility (CrossClimate2) plus premium winter (Alpin / X-Ice) — the safe, proven default.</p></div>
              <div class="item tp4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Falken</div></div><p class="note"><b>Specialist.</b> Podiums in both all-terrain (Wildpeak AT4W) and track-level performance (Azenis RT660+) — a genuine dual-category threat, not just a value pick.</p></div>
              <div class="item tp5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note"><b>Specialist.</b> Same dual strength as Falken — Open Country A/T III wins on snow-heavy all-terrain, Proxes Sport 2 competes directly in UUHP summer testing.</p></div>
              <div class="item tp6"><div class="item-top"><div class="item-name"><span class="rank-num">06</span>Goodyear</div></div><p class="note"><b>Specialist.</b> Ice traction specialist, backed by a strong all-season lineup.</p></div>
              <div class="item tp7"><div class="item-top"><div class="item-name"><span class="rank-num">07</span>Nokian</div></div><p class="note"><b>Specialist.</b> Winter/snow specialist — Nordic-tested, and the dedicated winter all-terrain benchmark.</p></div>
              <div class="item tp8"><div class="item-top"><div class="item-name"><span class="rank-num">08</span>BFGoodrich</div></div><p class="note"><b>Specialist.</b> All-terrain benchmark — the tire other AT tires get measured against.</p></div>
              <div class="item tp9"><div class="item-top"><div class="item-name"><span class="rank-num">09</span>Bridgestone</div></div><p class="note"><b>Specialist.</b> Winter ice/snow (Blizzak) paired with genuine UHP performance credentials (Potenza).</p></div>
              <div class="item tp10"><div class="item-top"><div class="item-name"><span class="rank-num">10</span>Hankook</div></div><p class="note"><b>Value.</b> Value-forward all-season and winter — competes directly with the premium tier at a lower price.</p></div>
            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-pc">
            <summary><span class="summary-txt">Passenger Car</span><span class="count-tag">sedans, coupes</span></summary>
            <div class="acc-body">

              <details class="sub theme-standard" id="cat-standard">
                <summary><span class="summary-txt">Standard Touring</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">The everyday default: point A to B, decent tread life, competent but unremarkable. One tier below Premium Touring — trades some comfort/quiet/wear for a noticeably lower price.</p>
                  <div class="item sd1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Defender2 (and the outgoing Defender T+H) is explicitly built and marketed as a Standard Touring All-Season tire — Tire Rack's own "Standard Touring All-Season" test used it as the class reference point against the Assurance MaxLife.</p></div>
                  <div class="item sd2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Goodyear</div></div><p class="note">Assurance MaxLife2 is Defender2's direct rival in that same Standard Touring tier — slightly ahead on wet handling and warranty mileage (137,000 km vs 129,000 km), while Michelin holds a small wet-braking edge.</p></div>
                  <div class="item sd3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Hankook</div></div><p class="note">Kinergy XP is the budget-value standout in this tier — a 121,000 km warranty at a noticeably lower price than the Michelin/Goodyear pair, without a major performance cliff.</p></div>
                  <div class="item sd4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Kumho</div></div><p class="note">Majesty 9 Solus TA91 is repeatedly used as the budget-tier reference point in independent Standard Touring comparisons — genuinely competitive dry/wet grip for the price.</p></div>
                  <div class="item sd5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Vredestein</div></div><p class="note">HiTrac All Season sits solidly mid-pack in this tier on independent comparisons — a lesser-known name, but a legitimate Standard Touring option worth cross-shopping.</p></div>
                </div>
              </details>

              <details class="sub theme-midtouring" id="cat-midtouring">
                <summary><span class="summary-txt">Mid-Range Touring</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Distinct from Standard Touring above: these are brands with a genuine reputation for punching above their price point, not major brands' own budget product lines. The value tier proper.</p>
                  <div class="item mt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">Solus TA31 (and the newer TA51a) shows up repeatedly as the value leader across independent budget-tire roundups — the most rating-per-dollar in its class, with a controlled ride that doesn't feel flimsy for the price.</p></div>
                  <div class="item mt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Hankook</div></div><p class="note">Kinergy PT is the mileage-focused pick of this tier — reduced road noise and fuel consumption for everyday driving, and a favorite OEM-equivalent swap for Hyundai/Kia/Genesis owners.</p></div>
                  <div class="item mt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Sincera SN250 A/S posts standout wet-traction and treadwear scores for the price, backed by millions of reported owner miles — a smart pick for high-mileage commuters.</p></div>
                  <div class="item mt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Cooper</div></div><p class="note">Evolution Tour is the comfort-oriented choice of this tier — Cooper consistently lands in the sweet spot between price and trust across independent reviews.</p></div>
                  <div class="item mt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nexen</div></div><p class="note">N'Priz AH5 is the best-warranty pick at the true budget end — a reasonable choice for drivers who want the lowest real cost per tire without dropping to unbranded imports.</p></div>
                </div>
              </details>

              <details class="sub theme-premium" id="cat-premium">
                <summary><span class="summary-txt">Premium Touring</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">The step up from Standard Touring: a quieter cabin, longer tread life, and often better wet grip or lower rolling resistance for fuel economy — comfort-first, all-season-capable tires for drivers who want the nicest daily-driver ride without paying for performance they'll never use.</p>
                  <div class="item pt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">TrueContact Tour 54 is explicitly labeled a "premium Grand Touring" tire in direct comparisons, and beat its closest rivals on wet handling, winter control, and overall placement in two separate Tire Rack tests.</p></div>
                  <div class="item pt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Turanza QuietTrack sits in the same premium tier — strongest on outright traction (SimpleScore 9.7 vs 8.4) and noise mitigation, the pick when cabin quiet is the top priority.</p></div>
                  <div class="item pt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note">Primacy Tour A/S is Michelin's actual Premium Touring entry (distinct from the Standard-tier Defender2) — chosen as OEM fitment by Acura, Lexus, BMW, Mercedes-Benz, and Cadillac specifically for its quiet tread design.</p></div>
                  <div class="item pt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Yokohama</div></div><p class="note">AVID Ascend GT competes directly in this same tier — tight grip in dry and wet, plus solid light-snow manners for a non-3PMSF touring tire.</p></div>
                  <div class="item pt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Pirelli</div></div><p class="note">P7 AS Plus 3 rounds out Tire Rack's Grand Touring All-Season field alongside strong competitors — a dependable, comfort-oriented choice, though with less head-to-head test data available than the top four.</p></div>
                </div>
              </details>

              <details class="sub theme-grandtouring" id="cat-grandtouring">
                <summary><span class="summary-txt">Grand Touring (Summer)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">A step up again in performance and outright grip over Premium Touring, while still holding on to comfort and a quiet cabin — the closest a touring-family tire gets to performance-tire feel without giving up everyday manners. Summer-only, not all-season.</p>
                  <div class="item gt1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">PremiumContact 7 has dominated the segment since its 2023 launch, winning 11 of 12 direct comparisons against the Michelin Primacy 4+, and posting class-leading wet braking and wet handling lap times.</p></div>
                  <div class="item gt2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Pirelli</div></div><p class="note">Cinturato C3 is the newest entrant and has essentially matched PremiumContact 7 in overall rating — it actually beats the Continental on dry braking, handling, and cabin noise, making this a genuine rivalry rather than a runaway.</p></div>
                  <div class="item gt3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Turanza T005 is rated among the strongest in this segment overall, known for a particularly low rolling-resistance coefficient — the pick if fuel economy matters as much as grip.</p></div>
                  <div class="item gt4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">Eagle F1 Asymmetric 6 has won every European press test it's entered since its 2022 launch — strongest against the Turanza T005 specifically in outright wet and dry grip, though it trails on comfort and rolling resistance.</p></div>
                  <div class="item gt5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Michelin</div></div><p class="note">Primacy 4+ trails the field in most direct comparisons, but keeps a real edge in comfort and long-term refinement as the tire wears — the pick for drivers who value that over outright grip.</p></div>
                </div>
              </details>

              <details class="sub theme-performance" id="cat-performance">
                <summary><span class="summary-txt">Performance (Summer UHP / UUHP)</span></summary>
                <div class="sub-body">
                  <div class="item pf1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">P Zero was the standout winner of Tyre Reviews' 2026 ultra-high-performance summer test.</p></div>
                  <div class="item pf2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div></div><p class="note">Pilot Sport 5 remains one of the most consistently tested and recommended UHP tires; Pilot Sport Cup 2 served as the track-focused benchmark in the same UUHP test.</p></div>
                  <div class="item pf3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Potenza RE-71RS remains a benchmark streetable track tire, regularly used as the reference point in Tire Rack's own competition tire tests.</p></div>
                  <div class="item pf4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Falken</div></div><p class="note">Azenis RT660 / RT660+ regularly lines up in Tire Rack's own competition tests alongside the Bridgestone Potenza RE-71RS and Michelin Pilot Sport Cup 2 — genuine track-day company, not just a budget alternative.</p></div>
                  <div class="item pf5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">Proxes Sport 2 held its own in Tire Rack's 2025 UUHP summer test against the Falken FK510, BFGoodrich g-Force Phenom TA, Sumitomo HTR Z5, and Nitto NT555 G2.</p></div>
                </div>
              </details>

              <details class="sub theme-perfas" id="cat-perfas">
                <summary><span class="summary-txt">Performance All-Season</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Ultra-high-performance grip paired with a cold-flexible all-season compound — the closest thing to summer-UHP cornering and braking with a longer usable season than a pure summer tire, though still a notch below a true summer tire's peak dry/wet grip and still not a substitute for real winter tires once snow shows up.</p>
                  <div class="item pa1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">ExtremeContact DWS06 Plus is widely regarded as the segment's best all-rounder for mixed real-world driving — stronger handling, steering response, and cabin refinement than its closest rival across nearly a dozen direct comparisons.</p></div>
                  <div class="item pa2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div></div><p class="note">Pilot Sport All Season 4 is the braking-numbers specialist — shortest dry and wet stopping distances in most head-to-head tests, the pick if emergency-stop performance is the priority.</p></div>
                  <div class="item pa3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Goodyear</div></div><p class="note">Eagle F1 All Season was one of the strongest finishers in Tire Rack's own 5-tire UHPAS test on a Tesla Model 3, beating the Michelin on-road.</p></div>
                  <div class="item pa4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Bridgestone</div></div><p class="note">Potenza Sport AS also finished ahead of the pack in that same Tire Rack test — a genuine podium contender, not just a filler entry.</p></div>
                  <div class="item pa5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Pirelli</div></div><p class="note">P Zero All Season Plus led the dry handling group in a separate Tire Rack UHPAS test — a strong option in size availability and grip, though less commonly featured in head-to-head tests than the top four.</p></div>
                </div>
              </details>

              <details class="sub theme-allweather" id="cat-allweather">
                <summary><span class="summary-txt">All-Weather</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">3PMSF-certified tires built to handle light-to-moderate winter conditions year-round without a seasonal swap — a real step up from plain all-season, but not a substitute for dedicated winter tires in serious snow/ice climates. Ranked by combined dry + wet + snow braking distance from an independent DEKRA comparison.</p>
                  <div class="item aw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Cinturato All Season SF3 posted the best combined braking distance (72.8 m total across dry, wet, and snow) against four rival all-weather tires — also A-rated for wet grip on the EU tyre label.</p></div>
                  <div class="item aw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Turanza All Season 6 finished a close second in the same comparison (73.1 m combined).</p></div>
                  <div class="item aw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Michelin</div></div><p class="note">CrossClimate2 remains the best-known all-weather tire in North America — 3rd in this combined-braking test (74.6 m), and still one of the most broadly recommended year-round options.</p></div>
                  <div class="item aw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Continental</div></div><p class="note">AllSeasonContact 2 placed 4th here (75.5 m combined) — but won AutoBild's 2025 All Season Tire Test outright, a reminder that rankings shift with test methodology.</p></div>
                  <div class="item aw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Goodyear</div></div><p class="note">Assurance WeatherReady2 is Goodyear's 3PMSF all-weather entry, tested directly against CrossClimate2 by Goodyear itself — strong wet braking (1.6 m shorter than comparable tires), though not the outright class leader in this specific DEKRA comparison.</p></div>
                </div>
              </details>

              <details class="sub theme-winter" id="cat-winter">
                <summary><span class="summary-txt">Winter / Snow</span></summary>
                <div class="sub-body">
                  <div class="item t1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Continental</div></div><p class="note">VikingContact 8 won Tyre Reviews' 2025/26 Nordic studless test outright — consistent results across snow, ice, wet, dry, noise, and rolling resistance.</p></div>
                  <div class="item t2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Michelin</div><span class="status-pill new">New for 2026</span></div><p class="note">X-Ice Snow+ launches for the 2026 winter season — improves on the outgoing X-Ice Snow in performance and durability, plus Piano Acoustic Tuning for a quieter ride. Pilot Alpin PA4 remains their performance winter option.</p></div>
                  <div class="item t3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div><span class="status-pill new">New for 2026</span></div><p class="note">Blizzak IcePeak is the new flagship winter tire, launching nationally May 2026 — first Blizzak to carry both 3-Peak Mountain Snowflake and Ice Grip certifications, replacing the WS90 and DM-V2.</p></div>
                  <div class="item t4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Nokian</div></div><p class="note">Hakkapeliitta R5 posted the best braking distance and lap time in Tyre Reviews' snow test — the passenger-car benchmark, distinct from the LT-rated Hakkapeliitta LT3 built for trucks.</p></div>
                  <div class="item t5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Goodyear</div></div><p class="note">Ultra Grip Ice WRT is Goodyear's dedicated studless ice/snow tire for North America. UltraGrip Ice 3, which posted strong ice-braking results in the same test, is a Euro/Nordic-market tire not sold here — the WRT uses related ice-focused tread technology and remains a trusted Canadian winter option.</p></div>
                  <div class="callout"><b>Note:</b> Neither the X-Ice Snow+ nor the Blizzak IcePeak has been through a Tyre Reviews group test yet — both are brand new for the 2026 season. Treat as "ones to watch" until tested head-to-head.</div>
                </div>
              </details>

              <details class="sub theme-midwinter" id="cat-midwinter">
                <summary><span class="summary-txt">Mid-Range Winter</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Genuine winter capability — 3PMSF-certified, studdable in most cases — at a real discount to the flagship tier above. Not a substitute for the top tier in the harshest climates, but a legitimate value option for most winter drivers.</p>
                  <div class="item mw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Nokian</div></div><p class="note">Nordman North 9 is Nokian's own budget sub-brand, launched specifically to bring their Nordic winter-tire technology down to a more accessible price point.</p></div>
                  <div class="item mw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Hankook</div></div><p class="note">Winter i*cept RS3 delivers strong snow performance and good wet braking at a very competitive price — repeatedly cited as the mid-range standout in independent European testing.</p></div>
                  <div class="item mw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Yokohama</div></div><p class="note">iceGUARD G075 is a proven performer with especially wide fitment coverage, making it an easy find across most vehicle sizes.</p></div>
                  <div class="item mw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">AltiMAX Arctic 12 is stud-ready and wallet-friendly — confident snow and ice traction with broad size coverage, without the premium-tier price tag.</p></div>
                  <div class="item mw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Vredestein</div></div><p class="note">Wintrac performs well in snow and stays notably quiet for its price bracket.</p></div>
                </div>
              </details>

              <details class="sub theme-runflat" id="cat-runflat">
                <summary><span class="summary-txt">Run-Flat</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Passenger cars have the deepest run-flat selection of any vehicle type — standard OE fitment on most BMW and Mini models. Reinforced sidewall supports the vehicle for roughly 80 km at up to 80 km/h after total air loss.</p>
                  <div class="item rf1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Primacy MXM4 ZP leads on overall balance — comfort, wet grip, and tread life, backed by more than three million owner-reported miles. Pilot Sport All Season 4 ZP is their performance-focused ZP option for drivers who don't want to give up grip for run-flat security.</p></div>
                  <div class="item rf2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">DriveGuard Plus is repeatedly called out as the best-value run-flat — genuine run-flat safety without the premium price tag, with strong dry conditions and steering response.</p></div>
                  <div class="item rf3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Continental</div></div><p class="note">ProContact GX SSR posted the best winter-weather showing among run-flats in independent testing; ProContact RX SSR is the more budget-friendly SSR option with wider aftermarket size availability.</p></div>
                  <div class="item rf4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Pirelli</div></div><p class="note">Cinturato P7 All Season Run Flat brings Pirelli's touring comfort and low noise to the run-flat category — built for premium sedans.</p></div>
                  <div class="item rf5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Ventus S1 noble2 HRS is the value alternative of this group — cuts cost without giving up much on dry/wet handling.</p></div>
                  <div class="callout">Don't assume every run-flat fits your car — many, especially premium options, are OE-fitment specific with limited size availability outside the exact vehicles they were designed for.</div>
                </div>
              </details>

            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-suv">
            <summary><span class="summary-txt">SUV / Crossover</span><span class="count-tag">SUVs, minivans</span></summary>
            <div class="acc-body">
              <p class="card-sub" style="margin-top:-4px;">Body-on-frame SUVs (4Runner, Wrangler, Land Cruiser, Suburban/Tahoe) share a tire market with trucks — see the Truck section instead. This covers crossovers and mid-size SUVs, which genuinely mix passenger-car and truck-adjacent tire types.</p>

              <div class="callout gold">Grand Touring, Performance, Performance All-Season, All-Weather, and Winter fitment for SUVs all use the exact same brand rankings as Passenger Car above — the same tires (PremiumContact 7, CrossClimate2, VikingContact 8, X-Ice Snow+, and so on) are simply sold in CUV/SUV sizing, so nothing changes about which one wins.</div>

              <details class="sub theme-allterrain" id="cat-at-suv">
                <summary><span class="summary-txt">All-Terrain</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Purpose-built for crossovers, not adapted truck tires — tuned for a lighter platform, noticeably quieter on-road, and not meant for serious trail use. A different product line entirely from the Truck All-Terrain tires below.</p>
                  <div class="item su1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Falken</div></div><p class="note">Wildpeak A/T Trail was engineered from the ground up for CUVs — remarkably quiet for an all-terrain tire, with wide water-evacuation channels giving it a genuine wet-grip edge most AT tires don't have.</p></div>
                  <div class="item su2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">TerrainContact A/T is called out repeatedly as a category win specifically for crossover SUV owners — exceptional snow performance for a CUV-focused tire.</p></div>
                  <div class="item su3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>BFGoodrich</div></div><p class="note">Trail-Terrain T/A is BFGoodrich's quieter, CUV-tuned alternative to their truck-focused KO2/KO3 line — smoother ride, less road noise, still genuinely capable off pavement.</p></div>
                  <div class="item su4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Yokohama</div></div><p class="note">Geolandar (CUV line) runs slightly quieter and smoother on pavement than the Wildpeak A/T Trail in some size comparisons, at some cost to sidewall protection and snow capability.</p></div>
                  <div class="item su5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">Open Country A/T III is available in genuine CUV sizing too — the most well-rounded all-terrain option for owners who want one tire to split the difference between crossover comfort and real off-road capability.</p></div>
                </div>
              </details>

              <details class="sub theme-highway" id="cat-highway-suv">
                <summary><span class="summary-txt">Highway</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">A genuinely distinct product line from passenger-car touring tires — engineered for the extra weight and different load case of an SUV/CUV, usually with a stronger emphasis on wet grip that holds up as the tire wears.</p>
                  <div class="item uh1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Premier LTX is engineered specifically for SUVs, crossovers, and light trucks, distinct from the passenger-car Primacy Tour A/S — EverGrip technology uses expanding rain grooves so wet braking stays strong even as the tire wears down.</p></div>
                  <div class="item uh2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">CrossContact LX25 is Premier LTX's most commonly cited direct rival in this category — a dependable, comfort-oriented alternative.</p></div>
                  <div class="item uh3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Alenza A/S 02 is Bridgestone's SUV-specific touring/highway line — comfort-first, though with less head-to-head data available against the top two.</p></div>
                  <div class="item uh4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Pirelli</div></div><p class="note">Scorpion Verde A/S Plus rounds out the field with Pirelli's SUV all-season touring option.</p></div>
                  <div class="item uh5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Dynapro HP2 is the value pick of this group — a lower-cost SUV highway option without a major performance cliff.</p></div>
                </div>
              </details>

              <details class="sub theme-midrange" id="cat-midrange-suv">
                <summary><span class="summary-txt">Reliable Mid-Range (HT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Highway Terrain tires Tyre Reviews themselves label as "mid-range" or budget in their own group tests — genuinely competitive against premium CUV/SUV tires at a lower price, based on how they actually placed.</p>
                  <div class="item mr1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">The Crugen HT51 was "on another level" in Tyre Reviews' 2026 HT test — posted a snow traction time 0.2s clear of the Michelin benchmark in second place.</p></div>
                  <div class="item mr2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Firestone</div></div><p class="note">The Destination LE3 surprised in the same test by running the segment-benchmark Michelin Defender LTX M/S2 close on the snow handling lap.</p></div>
                  <div class="item mr3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Cooper</div></div><p class="note">The Endeavor Plus was one of two mid-range HT entries (with General) that stayed composed in winter conditions for an all-season-oriented tire.</p></div>
                  <div class="item mr4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">The brand-new Grabber HT held its own against established mid-range and premium HT tires, with slightly more playful handling past the limit.</p></div>
                  <div class="item mr5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Giti</div></div><p class="note">A genuine surprise in AutoBild's 2026 summer test — not a brand typically grouped with the premium tier, yet it scored well enough across wet and dry to join Hankook, Goodyear, Michelin, and Pirelli in the top "exemplary" rating.</p></div>
                  <div class="callout">Even Tyre Reviews' own budget entry — the Westlake SU318 HT — showed how far cheap has come, typically landing mid-pack rather than last in overall scoring, even if it trailed on individual tests like snow acceleration.</div>
                </div>
              </details>

              <details class="sub theme-runflat" id="cat-runflat-suv">
                <summary><span class="summary-txt">Run-Flat</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">A genuinely different, thinner lineup than passenger car run-flats — purpose-engineered for SUV weight and ride height, not just a passenger-car run-flat stretched into a bigger size. Some tire lines don't offer an SUV run-flat variant at all.</p>
                  <div class="item rfs1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Scorpion Zero / Scorpion Verde All Season Run Flat was purpose-built to handle SUV weight and ride height while keeping handling composed rather than vague or floaty — common OE fitment on BMW X-series and Porsche Cayenne.</p></div>
                  <div class="item rfs2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Bridgestone</div></div><p class="note">Dueler H/P Sport RFT and Dueler H/L 400 RFT use dual-layer tread construction specifically to handle the extra load of a heavier SUV, with the precise steering response pickup drivers look for.</p></div>
                  <div class="item rfs3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Continental</div></div><p class="note">CrossContact LX Sport SSR and ContiSportContact 5 SUV SSR bring Continental's Self-Supporting Runflat technology to genuine SUV-specific sizing.</p></div>
                  <div class="item rfs4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Michelin</div></div><p class="note">The Latitude line (Tour HP ZP, Alpin LA2 ZP) and Pilot Alpin 5 SUV ZP are Michelin's genuine SUV-specific Zero Pressure run-flats, distinct from their passenger-car ZP lineup.</p></div>
                  <div class="item rfs5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Hankook</div></div><p class="note">Ventus S1 evo3 SUV K127C HRS is the value entry in genuine SUV run-flat sizing — a real alternative when the premium brands' SUV run-flat selection doesn't stock your size.</p></div>
                </div>
              </details>
            </div>
          </details>

          <details class="acc vehicle-acc" id="rank-truck">
            <summary><span class="summary-txt">Truck</span><span class="count-tag">body-on-frame, LT-rated</span></summary>
            <div class="acc-body">
              <p class="card-sub" style="margin-top:-4px;">Covers body-on-frame trucks and SUVs (F-150, Silverado, Ram, 4Runner, Wrangler, Land Cruiser, Suburban/Tahoe) — heavier-duty products built for real load capacity and off-road use, not the lighter crossover-tuned tires above.</p>

              <details class="sub theme-allterrain" id="cat-at-lt">
                <summary><span class="summary-txt">All-Terrain (LT)</span></summary>
                <div class="sub-body">
                  <div class="item at1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Pirelli</div></div><p class="note">Scorpion XTM AT was the test winner of Tyre Reviews' 2026 all-terrain test — strongest in dirt handling, subjective dirt handling, snow traction, subjective snow handling, and subjective wet handling.</p></div>
                  <div class="item at2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Falken</div></div><p class="note">Wildpeak AT4W won a Tire Rack-sourced head-to-head against the Toyo Open Country A/T III — class-leading wet braking and aquaplaning resistance, shorter dry stops, quieter ride, and stronger dirt control.</p></div>
                  <div class="item at3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Toyo</div></div><p class="note">Open Country A/T III took the win when that same comparison shifted to snow — quicker snow handling, traction, and subjective control than the Wildpeak AT4W, though with slightly weaker braking.</p></div>
                  <div class="item at4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>BFGoodrich</div></div><p class="note">All-Terrain KO3 is treated as the segment benchmark across multiple Tyre Reviews AT comparisons — the direct replacement for the legendary KO2.</p></div>
                  <div class="item at5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nokian</div></div><p class="note">Outpost nAT was rated the best all-terrain tire for winter conditions — stood out in ice braking, consistent across every test.</p></div>
                  <div class="callout">Falken vs. Toyo comes down to priorities: pick the Falken Wildpeak for on-road wet/dry manners and quiet comfort, pick the Toyo Open Country for snow-heavy climates. Both are 3-Peak Mountain Snowflake certified.</div>
                </div>
              </details>

              <details class="sub theme-highway" id="cat-highway-lt">
                <summary><span class="summary-txt">Standard Highway (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">For trucks that stay mostly on pavement — commuting, towing, hauling — without the off-road tread of an All-Terrain tire. Quieter, longer tread life, better fuel economy.</p>
                  <div class="item hw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Defender LTX M/S2 posts a dominant wet stopping distance (41.6 m vs 49.7 m for the Dueler H/L Alenza Plus, 52.0 m for the Wrangler SR-A) and the best snow traction score of the group in Michelin's own published testing.</p></div>
                  <div class="item hw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Continental</div></div><p class="note">TerrainContact H/T runs quieter than the Defender LTX with slightly better wet braking per independent AAA test data, and a lower rolling resistance.</p></div>
                  <div class="item hw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Dueler H/L Alenza Plus is the smoothest-riding tire in this class, backed by a 129,000 km warranty — the longest of the group.</p></div>
                  <div class="item hw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">Wrangler Fortitude HT gets you nearly identical ride and noise to the Defender LTX M/S2, often for meaningfully less money.</p></div>
                  <div class="item hw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Cooper</div></div><p class="note">Discoverer HT3 is the value pick of the group — matches the class's 3PMSF severe-snow rating at a noticeably lower price, with a slightly stiffer sidewall that's actually a plus for higher GVWR trucks.</p></div>
                </div>
              </details>

              <details class="sub theme-midhighway" id="cat-midhighway">
                <summary><span class="summary-txt">Mid-Range Highway (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">A genuine value tier below Standard Highway — real LT-rated highway tires from established brands, not a step down to unbranded imports.</p>
                  <div class="item mh1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Kumho</div></div><p class="note">Crugen HT51 stands out with strong treadwear and the highest snow score in Kumho's truck lineup — an excellent value pick for half-ton owners who tow occasionally and want winter capability without an all-terrain tire's noise.</p></div>
                  <div class="item mh2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Yokohama</div></div><p class="note">Geolandar H/T4 (LT sizes) leads this tier on longevity, built for confident towing and hauling with a genuinely long tread-life warranty.</p></div>
                  <div class="item mh3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Wildpeak H/T02 rounds out the value tier — Falken's balance of performance and affordability shows up clearly in this segment too, not just their AT lineup.</p></div>
                  <div class="item mh4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>General</div></div><p class="note">AltiMAX RT43 (LT-compatible sizing) is a dependable, widely-available value option for owners who want a known brand without the Standard Highway price premium.</p></div>
                  <div class="item mh5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Westlake</div></div><p class="note">The true budget end of this tier — Tyre Reviews' own budget benchmark in HT testing, showing how far cheap has come even if it trails the group on individual tests like snow acceleration.</p></div>
                </div>
              </details>

              <details class="sub theme-hybrid" id="cat-hybrid-lt">
                <summary><span class="summary-txt">Hybrid / Trail Highway (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">A step between Standard Highway and full All-Terrain — highway comfort and quiet most of the time, with light off-road capability (gravel, forest service roads, mild trail) when needed, without committing to an aggressive AT tread.</p>
                  <div class="item hy1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">LTX Trail balances on-road comfort with genuine light off-road capability — reviewers consistently rate it ahead of its direct rivals on winter traction and ice/snow braking specifically.</p></div>
                  <div class="item hy2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Goodyear</div></div><p class="note">Wrangler All-Terrain Adventure with Kevlar matches the LTX Trail's on-road refinement and ride quality with very capable off-road ability — possibly a slight edge in treadwear and longevity.</p></div>
                  <div class="item hy3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Wildpeak A/T Trail is the budget-friendly pick — surprising off-road competence for the price, though it can't quite match the LTX Trail's on-road comfort, low noise, or tread life.</p></div>
                  <div class="item hy4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>BFGoodrich</div></div><p class="note">Trail-Terrain T/A rounds out this tier with BFGoodrich's usual comfort-first tuning — a reasonable option, though with less direct head-to-head data against the top three specifically in this LT trim.</p></div>
                  <div class="item hy5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>General</div></div><p class="note">Grabber APT is a newer entrant in this exact niche — worth cross-shopping, though it has less independent long-term test data than the more established options above.</p></div>
                </div>
              </details>

              <details class="sub theme-heavyduty" id="cat-heavyduty">
                <summary><span class="summary-txt">Heavy Duty Highway (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Built specifically for heavy-duty pickups (F-250/F-350, Silverado/Sierra 2500/3500, Ram 2500/3500) — reinforced for real towing and hauling loads, not just a Standard Highway tire in a bigger size. This is a newer, smaller category with less head-to-head test data than the tiers above.</p>
                  <div class="item hd1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Defender LTX Platinum is a genuinely new tier from Michelin, not just a rebadge — engineered specifically for luxury/HD pickups, with roughly double the tread life of the standard LTX M/S2 and reinforced sidewall construction built around towing loads.</p></div>
                  <div class="item hd2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Toyo</div></div><p class="note">Open Country H/T II is a well-established HD-capable highway option, though it predates the LTX Platinum and hasn't been tested directly against it yet.</p></div>
                  <div class="item hd3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Duravis APT IV is Bridgestone's commercial/HD-duty highway line — a reasonable alternative, though with less consumer-facing test coverage than the passenger-truck-focused options.</p></div>
                </div>
              </details>

              <details class="sub theme-ltwinter" id="cat-ltwinter">
                <summary><span class="summary-txt">Winter (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Dedicated winter tires built in LT load ranges for trucks and body-on-frame SUVs — a different compound and construction from the passenger-car winter tires above, built to handle real load while towing or hauling in snow.</p>
                  <div class="item lw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Nokian</div></div><p class="note">Hakkapeliitta LT3 rates strongest on ice and snow across independent comparison data — studded versions available for the harshest conditions.</p></div>
                  <div class="item lw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Cooper</div></div><p class="note">Discoverer Snow Claw sits right behind the Nokian on winter grip, with a notably comfortable ride for a dedicated LT winter tire.</p></div>
                  <div class="item lw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Blizzak LT is a consistent, widely-available all-rounder — though owners report its LT-specific compound isn't quite as ice-focused as Bridgestone's passenger-car Blizzak line.</p></div>
                  <div class="item lw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">Ultra Grip Ice WRT (LT) offers a decent balance of winter and wet performance, with slightly lower comfort than the top three.</p></div>
                  <div class="item lw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">Open Country WLT1 leads this group on tread-life durability, with solid — if not class-leading — winter performance.</p></div>
                </div>
              </details>

              <details class="sub theme-midltwinter" id="cat-midltwinter">
                <summary><span class="summary-txt">Mid-Range Winter (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Real LT-rated, 3PMSF-certified winter tires at a genuine discount to the flagship tier above — a legitimate option for truck owners who want real winter capability without the premium-tier price.</p>
                  <div class="item mlw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>General</div></div><p class="note">Grabber Arctic LT is DuraGen-reinforced for durability and cut/tear resistance, studdable, 3PMSF-certified, and backed by a 72-month warranty — widely praised by truck owners as excellent value for the price.</p></div>
                  <div class="item mlw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Firestone</div></div><p class="note">Winterforce LT is a longtime budget LT winter option — studdable with a patented tread for snow and wet-road grip, though some owners consider it a step below the true premium tier.</p></div>
                  <div class="item mlw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Hercules</div></div><p class="note">Avalanche TT is a genuine budget contender that comes up in real truck-owner buying discussions when the top-tier brands don't stock a needed size or load rating.</p></div>
                  <div class="item mlw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Hankook</div></div><p class="note">Dynapro (winter LT trim) extends Hankook's established value reputation into the LT winter category — less directly tested in LT sizing than the top three, but a reasonable value option.</p></div>
                  <div class="item mlw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nokian</div></div><p class="note">Nordman (LT-compatible sizing) brings Nokian's budget sub-brand into truck territory — the same value proposition as the passenger-car Nordman line, less independently tested in LT specifically.</p></div>
                </div>
              </details>
            </div>
          </details>

          <details class="sub theme-avoid">
            <summary><span class="summary-txt">Top 10 Brands to Avoid</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">A few ultra-budget import brands come up again and again at the bottom of independent comparative tests and in mechanic/owner reports — not just "basic," but with genuine safety concerns. Several of these are widely stocked specifically because of aggressive pricing, which is exactly why they're worth knowing about. Not exhaustive — treat it as a reason to research a specific model before buying an unfamiliar budget brand.</p>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Triangle</div></div><p class="note">Repeatedly posted the worst wet-braking results in independent multi-brand comparison tests — in one, a Triangle-equipped car was still travelling at nearly 48 km/h when premium-tire cars in the same test had already stopped.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Accelera</div></div><p class="note">Independent Tyre Reviews rankings have placed tested Accelera models near the very bottom of their field (152nd of 192 in one comparison), with owners commonly reporting weak grip and long braking distances.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Geostar</div></div><p class="note">Frequently flagged by mechanics for premature tread balding and belt separation, and finished at the bottom of comparative testing from outlets like VW Vortex.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Sailun</div></div><p class="note">A common sight on budget-focused retailer shelves — owners repeatedly report rapid tread wear, poor wet traction, and a noisy ride, the same pattern that shows up across several independent budget-tire roundups.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Kenda</div></div><p class="note">Widely sold as one of the cheapest options at big-box retailers; frequently cited for rapid tread wear and weak wet-surface traction relative to similarly-priced alternatives.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">06</span>Linglong</div></div><p class="note">Another frequent big-box budget pick, criticized across multiple sources for inconsistent build quality and rapid tread wear.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">07</span>Goodride</div></div><p class="note">Comes up across independent reviews and mechanic write-ups alike for unbalanced handling, weak grip in wet conditions, and tread life well short of similarly-priced alternatives.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">08</span>Compass</div></div><p class="note">Multiple independent write-ups document a pattern of tread separation and even complete blowouts — a structural failure mode, not just a performance shortfall.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">09</span>Telluride</div></div><p class="note">Consistently flagged for shorter-than-expected tread life, elevated road noise, and sub-par wet-weather grip across multiple independent brand roundups.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">10</span>Chaoyang</div></div><p class="note">Reports of thin sidewall protection and a tendency to "pop" at highway speeds show up repeatedly — the kind of failure mode that matters more than a slightly harsher ride.</p></div>
            </div>
          </details>
        </div>
      </details>
      </div>
    </details>

    <details class="res-section sec-shops">
      <summary><h2>Shops</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub" style="margin-bottom:2px;">Trusted local shops — Ottawa, ON region.</p>
      <p class="card-sub" style="font-style:italic;">These are personal recommendations based on direct experience, not an independent or exhaustive review of the local market — your own experience may vary.</p>

    <details class="res-section sec-parts">
      <summary><h2>Aftermarket Parts</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
