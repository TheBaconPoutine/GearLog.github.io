                  <div class="item hy1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le LTX Trail équilibre le confort routier avec une véritable capacité hors route légère — les critiques le classent systématiquement devant ses rivaux directs en traction hivernale et en freinage sur glace/neige spécifiquement.</p></div>
                  <div class="item hy2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Goodyear</div></div><p class="note">Le Wrangler All-Terrain Adventure with Kevlar égale le raffinement routier et la qualité de conduite du LTX Trail avec une capacité hors route très solide — possiblement un léger avantage en usure et en longévité.</p></div>
                  <div class="item hy3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Falken</div></div><p class="note">Le Wildpeak A/T Trail est le choix économique — une compétence hors route surprenante pour le prix, bien qu'il n'égale pas tout à fait le confort routier, le faible bruit ou la durée de vie du LTX Trail.</p></div>
                  <div class="item hy4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>BFGoodrich</div></div><p class="note">Le Trail-Terrain T/A complète ce segment avec le réglage habituel axé confort de BFGoodrich — une option raisonnable, bien qu'avec moins de données d'essais tête-à-tête directes face aux trois premiers dans cette version LT précisément.</p></div>
                  <div class="item hy5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>General</div></div><p class="note">Le Grabber APT est un nouvel arrivant dans ce créneau précis — à considérer, bien qu'il ait moins de données d'essais indépendants à long terme que les options plus établies ci-dessus.</p></div>
                </div>
              </details>

              <details class="sub theme-heavyduty" id="cat-heavyduty">
                <summary><span class="summary-txt">Route robuste (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Conçu spécifiquement pour les camionnettes robustes (F-250/F-350, Silverado/Sierra 2500/3500, Ram 2500/3500) — renforcé pour de vraies charges de remorquage et de transport, pas simplement un pneu Route standard dans un plus grand format. Une catégorie plus récente et plus restreinte, avec moins de données d'essais tête-à-tête que les segments ci-dessus.</p>
                  <div class="item hd1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Michelin</div></div><p class="note">Le Defender LTX Platinum est un tout nouveau segment chez Michelin, pas seulement un rebadgeage — conçu spécifiquement pour les camionnettes robustes/de luxe, avec environ le double de la durée de vie de la bande de roulement du LTX M/S2 standard et une construction de flanc renforcée pensée pour les charges de remorquage.</p></div>
                  <div class="item hd2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Toyo</div></div><p class="note">L'Open Country H/T II est une option robuste bien établie, bien qu'elle précède le LTX Platinum et n'ait pas encore été testée directement contre lui.</p></div>
                  <div class="item hd3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Le Duravis APT IV est la gamme route robuste/commerciale de Bridgestone — une alternative raisonnable, bien qu'avec une couverture d'essais destinée au grand public moins étendue que les options axées camionnettes personnelles.</p></div>
                </div>
              </details>

              <details class="sub theme-ltwinter" id="cat-ltwinter">
                <summary><span class="summary-txt">Hiver (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">Pneus d'hiver dédiés fabriqués en cotes de charge LT pour camions et VUS à châssis séparé — un composé et une construction différents des pneus d'hiver de voiture de tourisme ci-dessus, conçus pour gérer une vraie charge en remorquant ou transportant dans la neige.</p>
                  <div class="item lw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Nokian</div></div><p class="note">Le Hakkapeliitta LT3 se classe le plus fort sur glace et neige selon les données comparatives indépendantes — versions cloutées offertes pour les conditions les plus sévères.</p></div>
                  <div class="item lw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Cooper</div></div><p class="note">Le Discoverer Snow Claw se situe juste derrière le Nokian en adhérence hivernale, avec une conduite notablement confortable pour un pneu d'hiver LT dédié.</p></div>
                  <div class="item lw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Bridgestone</div></div><p class="note">Le Blizzak LT est un généraliste constant et largement disponible — bien que des propriétaires rapportent que son composé propre au LT n'est pas tout à fait aussi axé sur la glace que la gamme Blizzak pour voitures de tourisme de Bridgestone.</p></div>
                  <div class="item lw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Goodyear</div></div><p class="note">L'Ultra Grip Ice WRT (LT) offre un équilibre décent entre performance hivernale et mouillée, avec un confort légèrement inférieur aux trois premiers.</p></div>
                  <div class="item lw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Toyo</div></div><p class="note">L'Open Country WLT1 mène ce groupe en durabilité de la bande de roulement, avec une performance hivernale solide, sans être la meilleure de la catégorie.</p></div>
                </div>
              </details>

              <details class="sub theme-midltwinter" id="cat-midltwinter">
                <summary><span class="summary-txt">Hiver milieu de gamme (LT)</span></summary>
                <div class="sub-body">
                  <p class="card-sub" style="margin-top:2px;">De vrais pneus d'hiver homologués LT, certifiés 3PMSF, à un vrai rabais par rapport au segment phare ci-dessus — une option légitime pour les propriétaires de camions qui veulent une véritable capacité hivernale sans le prix du segment premium.</p>
                  <div class="item mlw1"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>General</div></div><p class="note">Le Grabber Arctic LT est renforcé avec la technologie DuraGen pour la durabilité et la résistance aux coupures/déchirures, cloutable, certifié 3PMSF, et appuyé par une garantie de 72 mois — largement salué par les propriétaires de camions comme un excellent rapport qualité-prix.</p></div>
                  <div class="item mlw2"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Firestone</div></div><p class="note">Le Winterforce LT est une option économique LT hivernale de longue date — cloutable avec une bande de roulement brevetée pour l'adhérence sur neige et chaussée mouillée, bien que certains propriétaires le considèrent en retrait par rapport au véritable segment premium.</p></div>
                  <div class="item mlw3"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Hercules</div></div><p class="note">L'Avalanche TT est un véritable concurrent économique qui revient dans les discussions réelles de propriétaires de camions lorsque les marques haut de gamme n'ont pas la dimension ou la cote de charge recherchée.</p></div>
                  <div class="item mlw4"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Hankook</div></div><p class="note">Le Dynapro (version hivernale LT) étend la réputation de valeur établie de Hankook à la catégorie hivernale LT — moins directement testé en dimension LT que les trois premiers, mais une option de valeur raisonnable.</p></div>
                  <div class="item mlw5"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Nokian</div></div><p class="note">Le Nordman (dimensions compatibles LT) amène la sous-marque économique de Nokian en territoire camion — la même proposition de valeur que la gamme Nordman pour voiture de tourisme, moins testée indépendamment en LT précisément.</p></div>
                </div>
              </details>
            </div>
          </details>

          <details class="sub theme-avoid">
            <summary><span class="summary-txt">Top 10 des marques à éviter</span></summary>
            <div class="sub-body">
              <p class="card-sub" style="margin-top:2px;">Quelques marques d'importation à très bas prix reviennent constamment en fin de classement dans les essais comparatifs indépendants et dans les rapports de mécaniciens/propriétaires — pas seulement « basiques », mais avec de véritables préoccupations de sécurité. Plusieurs sont largement vendues justement à cause de leur prix agressif, ce qui les rend d'autant plus importantes à connaître. Liste non exhaustive — considérez-la comme une raison de faire des recherches sur un modèle précis avant d'acheter une marque économique peu connue.</p>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">01</span>Triangle</div></div><p class="note">A obtenu à répétition les pires résultats de freinage sur chaussée mouillée dans des essais comparatifs indépendants multi-marques — dans l'un d'eux, une voiture chaussée de Triangle roulait encore à près de 48 km/h alors que des voitures à pneus premium du même essai s'étaient déjà arrêtées.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">02</span>Accelera</div></div><p class="note">Les classements indépendants de Tyre Reviews ont placé des modèles Accelera testés près du bas de leur classement (152e sur 192 dans une comparaison), les propriétaires signalant couramment une faible adhérence et de longues distances de freinage.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">03</span>Geostar</div></div><p class="note">Fréquemment signalé par des mécaniciens pour usure prématurée de la bande de roulement et séparation des nappes, et s'est classé au bas d'essais comparatifs menés par des sources comme VW Vortex.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">04</span>Sailun</div></div><p class="note">Une présence courante chez les détaillants axés sur le prix — les propriétaires signalent à répétition une usure rapide, une faible traction sur chaussée mouillée et un roulement bruyant, le même profil qui revient dans plusieurs comparatifs indépendants de pneus économiques.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">05</span>Kenda</div></div><p class="note">Largement vendu comme l'une des options les moins chères chez les grandes surfaces; fréquemment cité pour usure rapide de la bande de roulement et faible traction sur chaussée mouillée par rapport à des alternatives de prix similaire.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">06</span>Linglong</div></div><p class="note">Un autre choix économique fréquent en grande surface, critiqué par plusieurs sources pour une qualité de fabrication inconstante et une usure rapide.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">07</span>Goodride</div></div><p class="note">Revient constamment dans les avis indépendants et les commentaires de mécaniciens pour une tenue de route déséquilibrée, une faible adhérence en conditions mouillées, et une durée de vie bien inférieure à des alternatives de prix similaire.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">08</span>Compass</div></div><p class="note">Plusieurs analyses indépendantes documentent un profil récurrent de séparation de la bande de roulement, voire d'éclatements complets — un mode de défaillance structurel, pas seulement une faiblesse de performance.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">09</span>Telluride</div></div><p class="note">Constamment signalé pour une durée de vie plus courte que prévu, un niveau de bruit élevé, et une adhérence sur chaussée mouillée sous la moyenne dans plusieurs comparatifs indépendants de marques.</p></div>
              <div class="item avoid"><div class="item-top"><div class="item-name"><span class="rank-num">10</span>Chaoyang</div></div><p class="note">Des rapports de protection de flanc mince et une tendance à « éclater » à vitesse autoroutière reviennent régulièrement — le genre de défaillance qui compte plus qu'une conduite légèrement plus dure.</p></div>
            </div>
          </details>
        </div>
      </details>

    </details>

        <div class="item sec-oil"><div class="item-top"><div class="item-name">Motul</div></div><p class="note">Héritage du sport automobile français (Le Mans, MotoGP); technologie à base d'esters; populaire dans les scènes JDM et motos sportives</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Royal Purple</div></div><p class="note">Technologie d'additif exclusive Synerlec, mise en marché pour la réduction de friction et les gains de performance</p></div>
        <div class="item sec-oil"><div class="item-top"><div class="item-name">Redline</div></div><p class="note">Synthétique pur à base d'esters, prix premium — la référence pour la piste, le drag et l'huile de boîte manuelle</p></div>
      </div></details>
      </div>
    </details>

    <details class="res-section sec-rust">
      <summary><h2>Antirouille et protection du dessous de caisse</h2><span class="res-chevron">&#9660;</span></summary>
      <div class="res-section-body">
      <p class="card-sub">Produits à base d'huile/cire vs revêtement caoutchouté vs ne rien faire, ainsi que des produits recommandés et des ateliers locaux.</p>

      <div class="callout">
        <b>L'huile bat le caoutchouté, avec une exception.</b> Les revêtements à base de lanoline/huile (Fluid Film, Woolwax, Surface Shield) restent souples et s'infiltrent dans les joints, soudures et cavités plutôt que de former une coque rigide — et comme ils ne durcissent jamais complètement, une éraflure se referme en bonne partie d'elle-même puisque le produit s'écoule à nouveau sur la zone exposée. Le revêtement caoutchouté fait l'inverse avec le temps : à mesure que le véhicule fléchit au fil de sa vie, le revêtement rigide se fissure et s'écaille, et une fois cela fait, il emprisonne l'humidité et le sel de route directement contre le métal — accélérant souvent la rouille exactement aux endroits qu'il devait protéger. La vraie exception est un revêtement caoutchouté appliqué à l'état neuf, avant que le véhicule n'ait vu un kilométrage significatif ou du sel de route; dans cette fenêtre étroite, il n'a pas encore eu la chance de se fissurer et peut encore bien faire son travail. Le compromis avec les produits à base d'huile est l'entretien — puisqu'ils restent souples, ils s'usent aussi et nécessitent une réapplication environ une fois par année.
      </div>
      <div class="callout callout-b">
        <b>Vs ne rien faire :</b> n'importe lequel de ces produits est nettement meilleur que le métal nu exposé aux hivers canadiens, et leur principale valeur est d'empêcher la rouille de commencer. Une fois que la rouille s'est déjà installée sous l'humidité emprisonnée, aucun revêtement ne règle ça à lui seul — la rouille doit d'abord être traitée ou retirée.
      </div>

      <details class="sub" open>
        <summary><span class="summary-txt">Produits recommandés</span></summary>
        <div class="sub-body">
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.fluid-film.com/" target="_blank" rel="noopener">Fluid Film</a></div></div><p class="note">L'huile antirouille à base de lanoline la plus connue et la plus répandue — assez fluide pour s'infiltrer profondément dans les joints et cavités, avec un long historique en prévention de la corrosion marine et aéronautique. A une odeur de lanoline distincte qui s'estompe après quelques jours.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.woolwax.com/" target="_blank" rel="noopener">Woolwax</a></div></div><p class="note">Également à base de lanoline, mais nettement plus épais que le Fluid Film — résiste mieux au lessivage sur les zones très exposées comme les bas de caisse et les passages de roue, avec moins d'odeur. Une version à faible viscosité (LV) existe pour s'infiltrer dans les joints serrés.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://blasterproducts.com/product/surface-shield/" target="_blank" rel="noopener">Surface Shield (B'laster)</a></div></div><p class="note">Un produit plus récent à base de lanoline, positionné comme comparable au Fluid Film et au Woolwax, offrant jusqu'à 2 ans de protection selon le fabricant. Largement disponible en quincaillerie, ce qui en fait un choix facile pour un travail sur l'entrée de garage.</p></div>
          <div class="callout callout-c" style="margin-top:16px;">Project Farm a soumis des fluides antirouille à des essais comparatifs (plusieurs produits appliqués côte à côte, suivis sur une saison hivernale) — à voir avant de choisir un produit. Voir la section Autres ressources ci-dessus pour leur chaîne.</div>
        </div>
      </details>

      <details class="sub">
        <summary><span class="summary-txt">Ateliers locaux</span></summary>
        <div class="sub-body">
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.rustproofingottawa.com/" target="_blank" rel="noopener">Oil Shield Rust Proofing Ottawa</a></div></div><p class="note">Option économique pour la protection antirouille à base d'huile.</p></div>
          <div class="item sec-rust"><div class="item-top"><div class="item-name"><a href="https://www.fullmoonautoworks.ca/" target="_blank" rel="noopener">Full Moon Autoworks</a></div></div><p class="note">Utilise le Fluid Film pour leur service de protection antirouille.</p></div>
        </div>
      </details>
      </div>
    </details>

    <footer class="foot">Ressources GearLog — compilé le 19 août 2026</footer>
  `;
}

function render(){
  try{
    document.documentElement.lang = state.language;
    let html = headerHTML() + navHTML();
    html += resourcesPageHTML();
    html += footerHTML() + changelogModalHTML() + confirmModalHTML() + toastHTML();
    appEl.innerHTML = html;
  }catch(err){
    console.error("GearLog render error:", err);
    appEl.innerHTML = `
      <div style="padding:60px 20px; text-align:center; font-family:sans-serif; color:#EDEAE3;">
        <p style="color:#D4574B; font-size:15px;">Something went wrong displaying GearLog.</p>
        <p style="color:#9096A0; font-size:13px; max-width:420px; margin:8px auto 20px;">This is usually caused by leftover data from an older version. Clearing saved data will fix it — export a backup first if you can.</p>
        <button type="button" onclick="localStorage.removeItem('gearlog_state_v2'); localStorage.removeItem('gearlog_state_v1'); location.reload();" style="padding:12px 20px; background:#D4574B; color:#2A0C09; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Clear saved data & reload</button>
      </div>
    `;
  }
}

appEl.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("modal-overlay")){
    const overlayAction = e.target.getAttribute("data-dismiss-action");
    if(overlayAction === "dismiss-changelog"){
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
    }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const key = el.getAttribute("data-key");

  switch(action){
    case "dismiss-changelog":
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
      break;

    case "toggle-language":
      state.language = state.language === "en" ? "fr" : "en";
      saveState(); render();
      break;

    case "finder-start":
      finderState = { step: 1, answers: {} };
      renderFinderOnly();
      break;

    case "select-finder-answer": {
      const qId = key;
      const qVal = el.getAttribute("data-value");
      finderState.answers[qId] = qVal;
      finderState.step += 1;
      renderFinderOnly();
      break;
    }

    case "finder-back":
      finderState.step = Math.max(1, finderState.step - 1);
      renderFinderOnly();
      break;

    case "finder-restart":
      finderState = { step: 0, answers: {} };
      renderFinderOnly();
      break;

    case "finder-jump": {
      const vehicleWrapperId = key;
      const catId = el.getAttribute("data-value");
      setTimeout(() => {
        ["res-tires", "acc-rankings", vehicleWrapperId, catId].forEach(id => {
          const elx = id && document.getElementById(id);
          if(elx && elx.tagName === "DETAILS") elx.open = true;
        });
        const target = catId && document.getElementById(catId);
        if(target) target.scrollIntoView({behavior: "smooth", block: "start"});
      }, 50);
      break;
    }
  }
});
render();
</script>
