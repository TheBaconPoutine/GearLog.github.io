<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearLog — Share & Download</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2A93B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
window.CURRENT_PAGE = "share";

function helpPageHTML(){
  const shareUrl = "https://thebaconpoutine.github.io/GearLog.github.io/";
  return `
    <section class="card">
      <h2>${t("help.shareTitle")}</h2>
      <p class="card-sub">${t("help.shareIntro")}</p>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;">
        <input type="text" id="share-url-input" value="${shareUrl}" readonly style="flex:1; min-width:200px;">
        <button class="btn c-amber" type="button" data-action="copy-share-link">${t("help.copyLinkBtn")}</button>
      </div>
    </section>

    <section class="card">
      <h2>${t("help.installTitle")}</h2>
      <p class="card-sub">${t("help.installIntro")}</p>

      <div class="video-block">
        <p class="video-label">${t("help.androidLabel")}</p>
        <div class="video-embed">
          <iframe src="https://www.youtube.com/embed/5diRXI3fo6A" title="Install on Android" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-block">
        <p class="video-label">${t("help.iosLabel")}</p>
        <div class="video-embed">
          <iframe src="https://www.youtube.com/embed/vrthOQ2Wjas" title="Install on iOS" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </section>
  `;
}

function render(){
  try{
    document.documentElement.lang = state.language;
    let html = headerHTML() + navHTML();
    html += helpPageHTML();
    html += footerHTML() + changelogModalHTML() + confirmModalHTML() + toastHTML();
    appEl.innerHTML = html;
  }catch(err){
    console.error("GearLog render error:", err);
    appEl.innerHTML = `
      <div style="padding:60px 20px; text-align:center; font-family:sans-serif; color:#EDEAE3;">
        <p style="color:#D4574B; font-size:15px;">Something went wrong displaying GearLog.</p>
        <p style="color:#9096A0; font-size:13px; max-width:420px; margin:8px auto 20px;">This is usually caused by leftover data from an older version. Clearing saved data will fix it — export a backup first if you can.</p>
        <button type="button" onclick="localStorage.removeItem('gearlog_state_v2'); localStorage.removeItem('gearlog_state_v1'); location.reload();" style="padding:12px 20px; background:#D4574B; color:#2A0C09; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Clear saved data & reload</button>
      </div>
    `;
  }
}

appEl.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("modal-overlay")){
    const overlayAction = e.target.getAttribute("data-dismiss-action");
    if(overlayAction === "dismiss-changelog"){
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
    }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");

  switch(action){
    case "dismiss-changelog":
      state.lastSeenChangelogVersion = t("changelog")[0].version;
      saveState(); render();
      break;

    case "toggle-language":
      state.language = state.language === "en" ? "fr" : "en";
      saveState(); render();
      break;

    case "copy-share-link": {
      const input = document.getElementById("share-url-input");
      const url = input ? input.value : "";
      const done = () => showToast(t("help.linkCopiedToast"));
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done).catch(() => {
          input.select();
          document.execCommand("copy");
          done();
        });
      } else if(input){
        input.select();
        document.execCommand("copy");
        done();
      }
      break;
    }
  }
});

render();
</script>
</body>
</html>
